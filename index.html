<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOS LOCOS DEL IPTV | Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0c10; --card: #161b22; --accent: #6366f1; 
            --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
            --border: #30363d; --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; overflow-x: hidden; }

        /* HEADER FIJO */
        .header { 
            position: sticky; top: 0; z-index: 100;
            padding: 15px 20px; border-bottom: 1px solid var(--border); 
            background: rgba(10, 12, 16, 0.9); backdrop-filter: blur(10px);
            text-align: center; 
        }
        .header h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--gold); }

        /* NAVEGACIÓN INFERIOR PROFESIONAL */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(22, 27, 34, 0.98); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: #8b949e; font-size: 0.65rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.2s; width: 20%; }
        .nav-btn.active { color: var(--accent); }
        .nav-btn span { font-size: 1.4rem; }

        /* CONTENEDOR DE SECCIONES */
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .section { display: none; } /* ESTO OCULTA TODO POR DEFECTO */
        .section.active { display: block; animation: slideUp 0.25s ease-out; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); padding: 18px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: #0d1117; color: white; font-size: 16px; }
        
        .btn-main { 
            background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; 
            width: 100%; font-weight: 700; cursor: pointer; transition: 0.1s;
            box-shadow: 0 4px 0px #4338ca;
        }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0px #4338ca; }
        
        /* RESULTADO DE ENTREGA */
        #result-box { display: none; background: #0d1117; padding: 15px; border-radius: 15px; margin-top: 15px; border: 2px solid var(--success); }
        .copy-text { 
            background: #111827; padding: 12px; border-radius: 10px; 
            font-family: monospace; margin: 10px 0; display: block; font-size: 0.85rem; 
            white-space: pre-wrap; color: #fff; border: 1px dashed var(--success);
        }

        .list-item { background: #0d1117; padding: 12px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; }
        .actions-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-action { padding: 8px; border-radius: 8px; border: none; font-size: 0.6rem; font-weight: 800; color: white; }
        
        .admin-only { display: none; } /* Seguridad visual */
    </style>
</head>
<body>

<div id="login-scr" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 30px;">
    <div class="glass-card" style="width: 100%; text-align: center; border: 2px solid var(--gold);">
        <h1 style="color: var(--gold); margin-bottom: 20px;">LOS LOCOS DEL IPTV</h1>
        <input type="email" id="log-email" placeholder="Correo">
        <input type="password" id="log-pass" placeholder="Contraseña">
        <button onclick="handleLogin()" class="btn-main">ENTRAR AL PANEL</button>
    </div>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1>LOS LOCOS DEL IPTV</h1>
        <small id="role-display" style="color: var(--accent); font-weight: 800;"></small>
    </div>

    <div class="container">
        <div id="sec-pedir" class="section active">
            <div class="glass-card">
                <h3 style="margin-top:0;">📱 Generar Venta</h3>
                <input type="text" id="cust-name" placeholder="Nombre del Cliente">
                <select id="user-platforms-select"><option value="">Cargando servicios...</option></select>
                <button onclick="preConfirm()" class="btn-main">CONTINUAR</button>

                <div id="result-box">
                    <div class="copy-text" id="account-data"></div>
                    <button onclick="copyToClipboard()" class="btn-main" style="background: white; color: black; box-shadow: 0 4px 0 #ccc;">COPIAR DATOS 📋</button>
                </div>
            </div>
        </div>

        <div id="sec-stock" class="section">
            <div class="glass-card">
                <h3>📦 Cargar Inventario</h3>
                <input type="text" id="stk-name" placeholder="Servicio (Ej: MAGIS)">
                <textarea id="stk-creds" rows="4" placeholder="Pega el formato ordenado aquí..."></textarea>
                <input type="number" id="stk-cupos" placeholder="Número de Cupos">
                <button onclick="addStock()" class="btn-main" style="background: var(--gold); color: black; box-shadow: 0 4px 0 #b45309;">GUARDAR EN STOCK</button>
            </div>
            <div id="iptv-list"></div>
        </div>

        <div id="sec-equipo" class="section">
            <div class="glass-card">
                <h3>👥 Control de Miembros</h3>
                <input type="text" id="tm-name" placeholder="Nombre">
                <input type="email" id="tm-email" placeholder="Correo">
                <select id="tm-role"><option value="Seller">Vendedor</option><option value="Admin">Admin</option></select>
                <button onclick="addTeam()" class="btn-main">AGREGAR AL EQUIPO</button>
            </div>
            <div id="team-list"></div>
        </div>

        <div id="sec-ajustes" class="section">
            <div class="glass-card">
                <h3>⚙️ Configuración Global</h3>
                <label>Mensaje de Reglas:</label>
                <textarea id="rules-input" rows="3"></textarea>
                <button onclick="saveRules()" class="btn-main" style="margin-bottom: 20px;">GUARDAR REGLAS</button>
                
                <button onclick="clearLogs()" class="btn-main" style="background: var(--danger); box-shadow: 0 4px 0 #991b1b;">LIMPIAR HISTORIAL</button>
                <button onclick="handleLogout()" class="btn-main" style="background: #333; box-shadow: 0 4px 0 #000; margin-top: 15px;">CERRAR SESIÓN</button>
            </div>
            <div class="glass-card">
                <h3>📜 Registro de Ventas</h3>
                <div id="log-container"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="nav('sec-pedir', this)"><span>📱</span>PEDIR</button>
        <button class="nav-btn admin-only" onclick="nav('sec-stock', this)"><span>📦</span>STOCK</button>
        <button class="nav-btn admin-only" onclick="nav('sec-equipo', this)"><span>🛠️</span>EQUIPO</button>
        <button class="nav-btn admin-only" onclick="nav('sec-ajustes', this)"><span>⚙️</span>AJUSTES</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp, getDocs, where, limit, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_PRINCIPAL = "andyobregon799@gmail.com"; 
    let currentUserRole = "Seller";
    let cachedStock = {};

    window.handleLogin = async () => {
        const e = document.getElementById('log-email').value;
        const p = document.getElementById('log-pass').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Error al entrar."); }
    };

    window.handleLogout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async u => {
        if(u) {
            if(u.email.toLowerCase() === ADMIN_PRINCIPAL.toLowerCase()) {
                currentUserRole = "Admin";
            } else {
                const snap = await getDocs(query(collection(db, "equipo_andy"), where("email", "==", u.email)));
                if(!snap.empty) currentUserRole = snap.docs[0].data().rol;
            }
            
            if(currentUserRole === "Admin") document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'flex');
            
            document.getElementById('login-scr').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('role-display').innerText = `MODO: ${currentUserRole.toUpperCase()}`;
            initApp();
        }
    });

    function initApp() {
        // STOCK DINÁMICO
        onSnapshot(collection(db, "iptv_stock"), snap => {
            const sel = document.getElementById('user-platforms-select');
            const list = document.getElementById('iptv-list');
            sel.innerHTML = '<option value="">Elige servicio...</option>';
            list.innerHTML = "";
            cachedStock = {};

            snap.forEach(d => {
                const i = d.data();
                if(i.cupos > 0) {
                    if(!cachedStock[i.nombre]) {
                        cachedStock[i.nombre] = [];
                        sel.innerHTML += `<option value="${i.nombre}">${i.nombre}</option>`;
                    }
                    cachedStock[i.nombre].push({ id: d.id, ...i });
                }
                list.innerHTML += `<div class="list-item"><b>${i.nombre}</b> <span style="float:right; color:var(--gold)">CP: ${i.cupos}</span>
                <div class="actions-row">
                    <button onclick="editVal('${d.id}', ${i.cupos})" class="btn-action" style="background:var(--accent)">EDIT</button>
                    <button onclick="resetVal('${d.id}', ${i.inicial})" class="btn-action" style="background:var(--success)">RESET</button>
                    <button onclick="deleteDoc(doc(db,'iptv_stock','${d.id}'))" class="btn-action" style="background:var(--danger)">BORRAR</button>
                </div></div>`;
            });
        });

        // REGLAS
        onSnapshot(doc(db, "ajustes", "reglas"), d => { if(d.exists()) document.getElementById('rules-input').value = d.data().texto; });

        // EQUIPO E HISTORIAL (SOLO ADMIN)
        if(currentUserRole === "Admin") {
            onSnapshot(collection(db, "equipo_andy"), snap => {
                const list = document.getElementById('team-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    list.innerHTML += `<div class="list-item"><b>${m.nombre}</b> (${m.rol})<br><small>${m.email}</small>
                    <button onclick="deleteDoc(doc(db,'equipo_andy','${d.id}'))" style="background:var(--danger); border:none; color:white; padding:5px; border-radius:5px; margin-top:5px; width:100%;">ELIMINAR</button></div>`;
                });
            });

            onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc"), limit(10)), snap => {
                const cont = document.getElementById('log-container');
                cont.innerHTML = snap.docs.map(d => `<div style="font-size:0.7rem; border-bottom:1px solid #333; padding:5px 0;"><b>${d.data().admin.split('@')[0]}</b> entregó <b>${d.data().cuenta}</b></div>`).join('');
            });
        }
    }

    // NAVEGACIÓN ENTRE VENTANAS
    window.nav = (targetId, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(targetId).classList.add('active');
        btn.classList.add('active');
        // Resetear caja de resultado si se cambia de ventana
        document.getElementById('result-box').style.display = 'none';
    };

    // ACCIONES
    window.preConfirm = () => {
        const plat = document.getElementById('user-platforms-select').value;
        const cli = document.getElementById('cust-name').value;
        if(!plat || !cli) return alert("Completa los datos.");
        
        const item = cachedStock[plat][0];
        document.getElementById('account-data').innerText = item.creds;
        document.getElementById('result-box').style.display = 'block';

        updateDoc(doc(db, "iptv_stock", item.id), { cupos: item.cupos - 1 });
        addDoc(collection(db, "historial"), { admin: auth.currentUser.email, cliente: cli, cuenta: plat, fecha: serverTimestamp() });
    };

    window.addStock = () => {
        const n = document.getElementById('stk-name').value.toUpperCase();
        const c = document.getElementById('stk-creds').value;
        const cp = parseInt(document.getElementById('stk-cupos').value);
        if(n && c && cp) addDoc(collection(db, "iptv_stock"), { nombre: n, creds: c, cupos: cp, inicial: cp });
    };

    window.addTeam = () => {
        const n = document.getElementById('tm-name').value;
        const e = document.getElementById('tm-email').value;
        const r = document.getElementById('tm-role').value;
        if(n && e) addDoc(collection(db, "equipo_andy"), { nombre: n, email: e, rol: r });
    };

    window.editVal = (id, actual) => {
        const n = prompt("Nuevos cupos:", actual);
        if(n) updateDoc(doc(db, "iptv_stock", id), { cupos: parseInt(n) });
    };

    window.resetVal = (id, inicial) => updateDoc(doc(db, "iptv_stock", id), { cupos: inicial });

    window.clearLogs = async () => {
        if(confirm("¿Borrar historial?")) {
            const snap = await getDocs(collection(db, "historial"));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
    };

    window.saveRules = () => setDoc(doc(db, "ajustes", "reglas"), { texto: document.getElementById('rules-input').value });
    window.copyToClipboard = () => { navigator.clipboard.writeText(document.getElementById('account-data').innerText); alert("¡Copiado!"); };
</script>
</body>
</html>
