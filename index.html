<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOS LOCOS DEL IPTV | Panel Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0c10; --card: #161b22; --accent: #6366f1; 
            --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
            --border: #30363d; --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; overflow-x: hidden; }

        .header { padding: 25px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, #111827, var(--bg)); text-align: center; }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: #8b949e; font-size: 0.65rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); transform: translateY(-5px); }

        .container { padding: 20px; max-width: 500px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: #0d1117; color: white; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(99, 102, 241, 0.2); }
        
        .btn-main { 
            background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; 
            width: 100%; font-weight: 700; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0px #4338ca; margin-top: 10px;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0px #4338ca; }
        .btn-logout { background: #30363d; color: var(--danger); font-size: 0.8rem; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--danger); margin-top: 10px; cursor: pointer; }

        #rules-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.96); z-index: 2000; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .rules-content { background: var(--card); padding: 25px; border-radius: 25px; border: 2px solid var(--accent); width: 100%; max-width: 400px; }
        
        #result-box { display: none; background: #0d1117; padding: 15px; border-radius: 15px; margin-top: 15px; border: 2px solid var(--success); }
        .copy-text { 
            background: #111827; padding: 15px; border-radius: 10px; 
            font-family: 'Courier New', monospace; margin: 10px 0; 
            display: block; font-size: 0.85rem; white-space: pre-wrap; 
            color: #fff; border: 1px dashed var(--success);
        }

        .list-item { background: #0d1117; padding: 15px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; }
        .actions-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
        .btn-action { padding: 8px; border-radius: 8px; border: none; font-size: 0.6rem; font-weight: 800; color: white; cursor: pointer; }
        
        .admin-only { display: none; } /* Oculto por defecto */
    </style>
</head>
<body>

<div id="rules-modal">
    <div class="rules-content">
        <h2 style="color: var(--gold); margin: 0 0 15px 0;">⚠️ REGLAS DEL EQUIPO</h2>
        <div id="rules-text-display" style="font-size: 0.85rem; color: #ccc; margin-bottom: 20px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; background: #0d1117; padding: 10px; border-radius: 10px;">Cargando...</div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 0.85rem; margin-bottom: 20px; color: var(--success); font-weight: 600;">
            <input type="checkbox" id="accept-check" style="width: 20px; height: 20px;"> HE LEÍDO Y ACEPTO LAS REGLAS
        </label>
        <button onclick="confirmRules()" class="btn-main" style="background: var(--success); box-shadow: 0 4px 0 #166534;">ENTREGAR CUENTA ✅</button>
    </div>
</div>

<div id="login-scr" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 30px;">
    <div class="glass-card" style="width: 100%; text-align: center; border: 2px solid var(--gold);">
        <h1 style="color: var(--gold); font-size: 1.8rem; margin-bottom: 5px;">LOS LOCOS DEL IPTV</h1>
        <p style="font-size: 0.8rem; color: #8b949e; margin-bottom: 20px;">Panel de Ventas Oficial</p>
        <input type="email" id="log-email" placeholder="Correo de acceso">
        <input type="password" id="log-pass" placeholder="Contraseña">
        <button onclick="handleLogin()" class="btn-main">INGRESAR AL SISTEMA</button>
    </div>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1>LOS LOCOS DEL IPTV</h1>
        <small id="user-display" style="color: var(--accent); font-weight: 600;"></small><br>
        <button onclick="handleLogout()" class="btn-logout">CERRAR SESIÓN 🚪</button>
    </div>

    <div class="container">
        <div id="sec-user" class="section active">
            <div class="glass-card">
                <h3 style="margin-top:0;">🚀 Generar Nueva Cuenta</h3>
                <input type="text" id="cust-name" placeholder="Nombre del Cliente">
                <select id="user-platforms-select"><option value="">Cargando plataformas...</option></select>
                <button onclick="showRules()" class="btn-main">CONTINUAR ➔</button>

                <div id="result-box">
                    <p style="color:var(--success); font-weight:800; text-align:center; margin:0;">¡LISTA PARA ENVIAR! ✨</p>
                    <div class="copy-text" id="account-data">...</div>
                    <button onclick="copyToClipboard()" class="btn-main" style="background: white; color: black; box-shadow: 0 4px 0 #ccc;">COPIAR FORMATO 📋</button>
                </div>
            </div>
        </div>

        <div id="sec-stock" class="section admin-only">
            <div class="glass-card">
                <h3>📦 Cargar Inventario</h3>
                <input type="text" id="stk-name" placeholder="Ej: MAGIS TV">
                <textarea id="stk-creds" rows="5" placeholder="Pega el formato detallado aquí..."></textarea>
                <input type="number" id="stk-cupos" placeholder="Cantidad de Cupos">
                <button onclick="addStock()" class="btn-main" style="background: var(--gold); color: black; box-shadow: 0 4px 0 #b45309;">GUARDAR STOCK</button>
            </div>
            <div id="iptv-list"></div>
        </div>

        <div id="sec-team" class="section admin-only">
            <div class="glass-card">
                <h3>👥 Control de Equipo</h3>
                <input type="text" id="tm-name" placeholder="Nombre">
                <input type="email" id="tm-email" placeholder="Correo">
                <select id="tm-role"><option value="Seller">Vendedor (Acceso Limitado)</option><option value="Admin">Admin (Acceso Total)</option></select>
                <button onclick="addTeam()" class="btn-main">DAR ACCESO</button>
            </div>
            <div id="team-list"></div>
        </div>

        <div id="sec-config" class="section admin-only">
            <div class="glass-card">
                <h3>📝 Reglas de Entrega</h3>
                <textarea id="rules-input" rows="5"></textarea>
                <button onclick="saveRules()" class="btn-main">ACTUALIZAR REGLAS</button>
            </div>
            <div class="glass-card">
                <h3>📜 Registro de Ventas</h3>
                <button onclick="clearLogs()" class="btn-main" style="background: var(--danger); box-shadow: 0 4px 0 #991b1b;">LIMPIAR TODO EL HISTORIAL</button>
                <div id="log-container" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="nav('sec-user', this)"><span>📱</span>PEDIR</button>
        <button class="nav-btn admin-only" onclick="nav('sec-stock', this)"><span>📦</span>STOCK</button>
        <button class="nav-btn admin-only" onclick="nav('sec-team', this)"><span>🛠️</span>EQUIPO</button>
        <button class="nav-btn admin-only" onclick="nav('sec-config', this)"><span>⚙️</span>AJUSTES</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp, getDocs, where, limit, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let cachedStock = {};
    let currentUserRole = "Seller";

    // --- ACCESO ---
    window.handleLogin = async () => {
        const e = document.getElementById('log-email').value;
        const p = document.getElementById('log-pass').value;
        try { await signInWithEmailAndPassword(auth, e, p); } 
        catch(err) { alert("Acceso denegado. Verifica tus datos."); }
    };

    window.handleLogout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async u => {
        if(u) {
            // Verificar Rol antes de mostrar el panel
            const q = query(collection(db, "equipo_andy"), where("email", "==", u.email));
            const snap = await getDocs(q);
            
            if(!snap.empty) {
                currentUserRole = snap.docs[0].data().rol;
                if(currentUserRole === "Admin") {
                    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'flex');
                }
            }
            
            document.getElementById('login-scr').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('user-display').innerText = `ROL: ${currentUserRole.toUpperCase()} | ${u.email}`;
            initSystem();
        } else {
            document.getElementById('login-scr').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }
    });

    // --- LÓGICA DEL SISTEMA ---
    function initSystem() {
        onSnapshot(doc(db, "ajustes", "reglas"), d => {
            if(d.exists()) {
                document.getElementById('rules-text-display').innerText = d.data().texto;
                document.getElementById('rules-input').value = d.data().texto;
            }
        });

        onSnapshot(collection(db, "iptv_stock"), snap => {
            const select = document.getElementById('user-platforms-select');
            const list = document.getElementById('iptv-list');
            select.innerHTML = '<option value="">Elige Servicio...</option>';
            list.innerHTML = "";
            cachedStock = {};

            snap.forEach(d => {
                const i = d.data();
                if(i.cupos > 0) {
                    if(!cachedStock[i.nombre]) {
                        cachedStock[i.nombre] = [];
                        select.innerHTML += `<option value="${i.nombre}">${i.nombre}</option>`;
                    }
                    cachedStock[i.nombre].push({ id: d.id, ...i });
                }
                // Vista Admin de Stock
                list.innerHTML += `<div class="list-item"><b>${i.nombre}</b> <span style="float:right; color:var(--gold)">CP: ${i.cupos}</span><br><small style="white-space:pre-wrap; font-size:10px; color:#8b949e;">${i.creds.substring(0, 40)}...</small>
                <div class="actions-row">
                    <button onclick="editVal('${d.id}', ${i.cupos})" class="btn-action" style="background:var(--accent)">EDITAR</button>
                    <button onclick="resetVal('${d.id}', ${i.inicial || i.cupos})" class="btn-action" style="background:var(--success)">RESET</button>
                    <button onclick="deleteDoc(doc(db,'iptv_stock','${d.id}'))" class="btn-action" style="background:var(--danger)">BORRAR</button>
                </div></div>`;
            });
        });

        // Solo el Admin ve el equipo y historial completo
        if(currentUserRole === "Admin") {
            onSnapshot(collection(db, "equipo_andy"), snap => {
                const list = document.getElementById('team-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    list.innerHTML += `<div class="list-item"><b>${m.nombre}</b> (${m.rol})<br><small>${m.email}</small>
                    <div class="actions-row"><button onclick="deleteDoc(doc(db,'equipo_andy','${d.id}'))" class="btn-action" style="background:var(--danger)">REMOVER</button></div></div>`;
                });
            });

            onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc"), limit(20)), snap => {
                const cont = document.getElementById('log-container');
                cont.innerHTML = snap.docs.map(d => `<div style="font-size:0.75rem; border-bottom:1px solid #333; padding:8px 0; color:#ccc;"><b>${d.data().admin}</b> entregó <b>${d.data().cuenta}</b> a ${d.data().cliente}</div>`).join('');
            });
        }
    }

    // --- ACCIONES ---
    window.showRules = () => {
        if(!document.getElementById('cust-name').value || !document.getElementById('user-platforms-select').value) return alert("Faltan datos");
        document.getElementById('rules-modal').style.display = 'flex';
    };

    window.confirmRules = () => {
        if(!document.getElementById('accept-check').checked) return alert("Debes aceptar las reglas");
        
        const plat = document.getElementById('user-platforms-select').value;
        const item = cachedStock[plat][0];

        document.getElementById('account-data').innerText = item.creds;
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('rules-modal').style.display = 'none';

        updateDoc(doc(db, "iptv_stock", item.id), { cupos: item.cupos - 1 });
        addDoc(collection(db, "historial"), { admin: auth.currentUser.email, cliente: document.getElementById('cust-name').value, cuenta: plat, fecha: serverTimestamp() });
        document.getElementById('accept-check').checked = false;
    };

    window.addStock = () => {
        const n = document.getElementById('stk-name').value.toUpperCase();
        const c = document.getElementById('stk-creds').value;
        const cp = parseInt(document.getElementById('stk-cupos').value);
        if(n && c && cp) addDoc(collection(db, "iptv_stock"), { nombre: n, creds: c, cupos: cp, inicial: cp });
    };

    window.addTeam = () => {
        const n = document.getElementById('tm-name').value;
        const e = document.getElementById('tm-email').value;
        const r = document.getElementById('tm-role').value;
        if(n && e) addDoc(collection(db, "equipo_andy"), { nombre: n, email: e, rol: r });
    };

    window.editVal = async (id, actual) => {
        const n = prompt("Nuevo total de cupos:", actual);
        if(n) await updateDoc(doc(db, "iptv_stock", id), { cupos: parseInt(n) });
    };

    window.resetVal = (id, inicial) => updateDoc(doc(db, "iptv_stock", id), { cupos: inicial });

    window.clearLogs = async () => {
        if(confirm("¿Borrar todo el historial de ventas?")) {
            const snap = await getDocs(collection(db, "historial"));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
    };

    window.saveRules = () => setDoc(doc(db, "ajustes", "reglas"), { texto: document.getElementById('rules-input').value });
    window.copyToClipboard = () => { navigator.clipboard.writeText(document.getElementById('account-data').innerText); alert("¡Copiado!"); };
    
    window.nav = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };
</script>
</body>
</html>
