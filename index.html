<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDY RIFAS | Sorteos Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #f59e0b; 
            --danger: #ef4444; --success: #22c55e; --text: #f8fafc; 
            --border: #334155; --wa: #25d366;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        .nav-bar { 
            display: flex; background: var(--card); padding: 10px; 
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent);
            justify-content: space-around;
        }
        .nav-btn { 
            padding: 10px; border: none; background: transparent; 
            color: #94a3b8; font-weight: 600; cursor: pointer; border-radius: 8px; font-size: 0.8rem;
        }
        .nav-btn.active { color: white; background: var(--accent); }

        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        input, select { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid var(--border); background: #0f172a; color: white; box-sizing: border-box; 
        }
        
        .btn-main { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px; text-transform: uppercase;
        }
        .btn-save { background: var(--success); color: white; }
        .btn-wa { background: var(--wa); color: white; }
        .btn-draw { background: var(--accent); color: #000; font-size: 1.2rem; }

        .participant-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02);
            margin-bottom: 5px; border-radius: 8px;
        }
        .ticket-badge { background: var(--accent); color: black; padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        .status-paid { color: var(--success); font-size: 0.7rem; font-weight: bold; }
        
        /* Modal Ganador */
        #winner-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="login-box" style="display: flex; height: 100vh; align-items: center; justify-content: center;">
    <div class="card" style="width:320px; text-align:center;">
        <h1 style="color:var(--accent); margin:0;">ANDY RIFAS</h1>
        <p style="font-size:0.8rem; color:#94a3b8;">SORTEOS & PREMIOS</p>
        <input type="email" id="email" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()" class="btn-main btn-save">ENTRAR AL SISTEMA</button>
    </div>
</div>

<div id="app" style="display:none;">
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showTab('tab-registro', this)">🎟️ BOLETOS</button>
        <button class="nav-btn" onclick="showTab('tab-sorteo', this)">🏆 SORTEAR</button>
        <button class="nav-btn" onclick="showTab('tab-config', this)">⚙️ AJUSTES</button>
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;">X</button>
    </div>

    <div class="container">
        <div id="tab-registro" class="section active">
            <div class="card">
                <h3>🎟️ Registrar Participante</h3>
                <input type="text" id="p-nombre" placeholder="Nombre del Cliente">
                <input type="text" id="p-whatsapp" placeholder="WhatsApp (Ej: 573...)">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="p-cupo" placeholder="N° Boleto">
                    <select id="p-estado">
                        <option value="Pendiente">⏳ Pendiente</option>
                        <option value="Pagado">✅ Pagado</option>
                    </select>
                </div>
                <button onclick="registrarBoleto()" class="btn-main btn-save">RESERVAR CUPO</button>
            </div>
            
            <div id="lista-participantes"></div>
        </div>

        <div id="tab-sorteo" class="section">
            <div class="card" style="text-align: center;">
                <h2 style="color:var(--accent);">MODO SORTEO</h2>
                <p>Solo participan los números marcados como <b>PAGADOS</b>.</p>
                <div id="contador-pagados" style="font-size: 2rem; font-weight: 900; margin: 20px 0;">0</div>
                <button onclick="iniciarSorteo()" class="btn-main btn-draw">🔥 ¡GIRAR RULETA!</button>
            </div>
        </div>

        <div id="tab-config" class="section">
            <div class="card">
                <h3>📢 Mensaje Personalizado Ganador</h3>
                <textarea id="msg-ganador" style="width:100%; height:100px; background:#0f172a; color:white; border-radius:8px; padding:10px;">¡FELICIDADES! 🎉 Eres el ganador de nuestra rifa. Gracias por participar con ANDY RIFAS. 🏆</textarea>
            </div>
        </div>
    </div>
</div>

<div id="winner-overlay">
    <h1 style="color:var(--accent); font-size: 3rem;">¡GANADOR!</h1>
    <div id="winner-info" style="font-size: 2rem; margin: 20px;"></div>
    <button id="btn-wa-ganador" class="btn-main btn-wa" style="width: 250px;">NOTIFICAR POR WA</button>
    <button onclick="cerrarGanador()" style="margin-top:20px; background:none; border:none; color:white; text-decoration:underline; cursor:pointer;">Cerrar</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- AUTENTICACIÓN ---
    window.login = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Acceso denegado"); }
    };
    window.logout = () => signOut(auth);
    onAuthStateChanged(auth, u => {
        document.getElementById('login-box').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
    });

    // --- GESTIÓN DE RIFAS ---
    window.registrarBoleto = async () => {
        const d = {
            nombre: document.getElementById('p-nombre').value,
            wa: document.getElementById('p-whatsapp').value,
            cupo: document.getElementById('p-cupo').value,
            estado: document.getElementById('p-estado').value,
            timestamp: serverTimestamp()
        };
        if(!d.nombre || !d.cupo) return alert("Llena los campos");
        await addDoc(collection(db, "rifa_activa"), d);
        document.getElementById('p-nombre').value = "";
        document.getElementById('p-cupo').value = "";
    };

    let participantesPagados = [];

    onSnapshot(query(collection(db, "rifa_activa"), orderBy("timestamp", "desc")), s => {
        const lista = document.getElementById('lista-participantes');
        lista.innerHTML = "";
        participantesPagados = [];
        let contador = 0;

        s.forEach(docSnap => {
            const p = docSnap.data();
            if(p.estado === 'Pagado') {
                participantesPagados.push({id: docSnap.id, ...p});
                contador++;
            }
            
            const div = document.createElement('div');
            div.className = 'participant-item';
            div.innerHTML = `
                <div>
                    <span class="ticket-badge">#${p.cupo}</span> <b>${p.nombre}</b><br>
                    <span class="${p.estado === 'Pagado' ? 'status-paid' : ''}">${p.estado}</span>
                </div>
                <div class="actions">
                    <button onclick="confirmarPago('${docSnap.id}')" style="background:var(--success); border:none; padding:5px; border-radius:4px; cursor:pointer;">✅</button>
                    <button onclick="eliminar('${docSnap.id}')" style="background:var(--danger); border:none; padding:5px; border-radius:4px; cursor:pointer;">🗑️</button>
                </div>`;
            lista.appendChild(div);
        });
        document.getElementById('contador-pagados').innerText = contador;
    });

    window.confirmarPago = async (id) => {
        await updateDoc(doc(db, "rifa_activa", id), { estado: "Pagado" });
    };

    window.eliminar = async (id) => { if(confirm("¿Eliminar registro?")) await deleteDoc(doc(db, "rifa_activa", id)); };

    // --- LÓGICA DEL SORTEO ---
    window.iniciarSorteo = () => {
        if(participantesPagados.length === 0) return alert("No hay participantes con boletos pagados.");
        
        let count = 0;
        const interval = setInterval(() => {
            const randomPick = participantesPagados[Math.floor(Math.random() * participantesPagados.length)];
            document.getElementById('contador-pagados').innerText = `#${randomPick.cupo}`;
            count++;
            if(count > 20) {
                clearInterval(interval);
                mostrarGanador(randomPick);
            }
        }, 100);
    };

    function mostrarGanador(ganador) {
        const overlay = document.getElementById('winner-overlay');
        const info = document.getElementById('winner-info');
        const btnWa = document.getElementById('btn-wa-ganador');
        const msgCustom = document.getElementById('msg-ganador').value;

        info.innerHTML = `<span style="font-size:4rem;">#${ganador.cupo}</span><br>${ganador.nombre}`;
        overlay.style.display = 'flex';

        btnWa.onclick = () => {
            const text = encodeURIComponent(`*${msgCustom}*\n\n👤 Ganador: ${ganador.nombre}\n🎟️ Boleto: #${ganador.cupo}`);
            window.open(`https://wa.me/${ganador.wa}?text=${text}`, '_blank');
        };
    }

    window.cerrarGanador = () => {
        document.getElementById('winner-overlay').style.display = 'none';
        document.getElementById('contador-pagados').innerText = participantesPagados.length;
    };

    window.showTab = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
    };
</script>

</body>
</html>
