<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDY VIP | Business Suite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #030712; --card: #111827; --accent: #3b82f6; 
            --accent-glow: rgba(59, 130, 246, 0.5);
            --danger: #f43f5e; --success: #10b981; --text: #f9fafb; 
            --border: #374151; --gold: #fbbf24;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }
        
        /* HEADER EMPRESARIAL */
        .header { 
            background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
            padding: 20px; border-bottom: 1px solid var(--border); text-align: center;
        }
        .header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
        .header p { margin: 5px 0 0; font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; }

        /* NAVEGACIÓN INFERIOR (ESTILO APP) */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-item { border: none; background: none; color: #6b7280; font-size: 0.65rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 1.2rem; }

        /* DASHBOARD CARDS */
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .stat-card h4 { margin: 0; font-size: 0.7rem; color: #9ca3af; }
        .stat-card p { margin: 5px 0 0; font-size: 1.2rem; font-weight: 800; color: var(--success); }

        /* SECCIONES */
        .section { display: none; animation: slideUp 0.4s ease; }
        .section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            border: 1px solid var(--border); margin-bottom: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* BUSCADOR Y FILTROS */
        .search-area { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 100; }
        input, select, textarea { 
            width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; 
            border: 1px solid var(--border); background: #1f2937; color: white; font-size: 0.9rem;
        }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }

        /* GRID DE LÁMINAS PROFESIONAL */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item-card { 
            background: var(--card); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border); transition: 0.2s; position: relative;
        }
        .item-card.selected { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .item-card img { width: 100%; height: 130px; object-fit: cover; background: white; }
        .item-info { padding: 10px; text-align: center; }
        .item-info b { font-size: 0.75rem; display: block; margin-bottom: 4px; }
        
        .badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: white; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 800; }

        /* BOTONES */
        .btn-premium { 
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; padding: 16px; border-radius: 14px;
            width: 100%; font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }
    </style>
</head>
<body>

<div id="login-screen" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 20px;">
    <div class="glass-card" style="width: 100%; max-width: 350px; text-align: center;">
        <h1 style="color: var(--accent); font-size: 2rem; margin-bottom: 5px;">ANDY VIP</h1>
        <p style="font-size: 0.7rem; color: #9ca3af; margin-bottom: 30px;">BUSINESS ADMINISTRATION</p>
        <input type="email" id="email" placeholder="Usuario Corporativo">
        <input type="password" id="pass" placeholder="Contraseña Segura">
        <button onclick="login()" class="btn-premium" style="margin-top: 15px;">ACCEDER AL PANEL</button>
    </div>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1>ANDY BUSINESS</h1>
        <p id="user-display">Panel de Control Activo</p>
    </div>

    <div class="container">
        <div id="sec-dash" class="section active">
            <div class="stats-grid">
                <div class="stat-card"><h4>VENTAS HOY</h4><p>$0.00</p></div>
                <div class="stat-card"><h4>LÁMINAS</h4><p id="total-count">0</p></div>
            </div>
            
            <div class="glass-card">
                <h3>📦 Generar Nuevo Pedido</h3>
                <input type="text" id="cli-nom" placeholder="Nombre del Cliente">
                <input type="text" id="cli-wa" placeholder="WhatsApp (Ej: 593...)">
                <div class="search-area">
                    <input type="text" id="search" placeholder="🔍 Buscar entre miles de láminas..." onkeyup="filter()">
                </div>
                <div id="grid-items" class="grid"></div>
            </div>
        </div>

        <div id="sec-inv" class="section">
            <div class="glass-card">
                <h3>📤 Registro de Material</h3>
                <input type="text" id="in-title" placeholder="Título de la Lámina">
                <input type="text" id="in-url" placeholder="URL de Imagen (Directa)">
                <select id="in-cat">
                    <option value="Escolar">Escolar</option>
                    <option value="Anime">Anime</option>
                    <option value="Dibujos">Dibujos Animados</option>
                    <option value="Arte">Arte y Cultura</option>
                </select>
                <textarea id="in-info" placeholder="Resumen informativo de la lámina..." rows="4"></textarea>
                <button onclick="upload()" class="btn-premium">SUBIR A LA NUBE</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showSec('sec-dash', this)"><span>🏠</span>DASHBOARD</button>
        <button class="nav-item" onclick="showSec('sec-inv', this)"><span>📂</span>INVENTARIO</button>
        <button class="nav-item" onclick="logout()"><span>🚪</span>SALIR</button>
    </nav>
</div>

<div id="action-bar" style="position: fixed; bottom: 85px; left: 15px; right: 15px; display: none;">
    <button onclick="makePDF()" class="btn-premium" style="background: var(--success); box-shadow: 0 4px 14px var(--success);">
        GENERAR PDF DE <span id="sel-num">0</span> LÁMINAS ✅
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // TU CONFIGURACIÓN ORIGINAL
    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let laminas = [];
    let selected = [];

    // --- CARGAR DATOS ---
    onSnapshot(query(collection(db, "laminas_andy"), orderBy("titulo", "asc")), snap => {
        laminas = [];
        snap.forEach(d => laminas.push({ id: d.id, ...d.data() }));
        document.getElementById('total-count').innerText = laminas.length;
        render(laminas);
    });

    window.render = (data) => {
        const container = document.getElementById('grid-items');
        container.innerHTML = data.map(l => `
            <div class="item-card ${selected.includes(l.id)?'selected':''}" onclick="toggle('${l.id}')">
                <span class="badge">${l.cat || 'General'}</span>
                <img src="${l.url}" loading="lazy">
                <div class="item-info"><b>${l.titulo}</b></div>
            </div>
        `).join('');
    };

    window.filter = () => {
        const t = document.getElementById('search').value.toLowerCase();
        render(laminas.filter(l => l.titulo.toLowerCase().includes(t)));
    };

    window.toggle = (id) => {
        const idx = selected.indexOf(id);
        if(idx > -1) selected.splice(idx, 1); else selected.push(id);
        document.getElementById('sel-num').innerText = selected.length;
        document.getElementById('action-bar').style.display = selected.length > 0 ? 'block' : 'none';
        render(laminas);
    };

    // --- ACCIONES ---
    window.upload = async () => {
        const d = {
            titulo: document.getElementById('in-title').value,
            url: document.getElementById('in-url').value,
            cat: document.getElementById('in-cat').value,
            info: document.getElementById('in-info').value
        };
        if(!d.titulo || !d.url) return alert("Completa los campos");
        await addDoc(collection(db, "laminas_andy"), d);
        alert("Lámina añadida correctamente");
        showSec('sec-dash');
    };

    window.makePDF = () => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const cli = document.getElementById('cli-nom').value || "Cliente";

        selected.forEach((id, i) => {
            const data = laminas.find(x => x.id === id);
            if(i > 0) pdf.addPage();
            
            // Estilo de Hoja Profesional
            pdf.setDrawColor(59, 130, 246); pdf.setLineWidth(1.5);
            pdf.rect(5, 5, 200, 287);
            
            pdf.setFontSize(16); pdf.text(data.titulo.toUpperCase(), 105, 25, {align:"center"});
            try { pdf.addImage(data.url, 'JPEG', 15, 35, 180, 160); } catch(e){}
            
            pdf.setFontSize(12); pdf.text("INFORMACIÓN RELEVANTE:", 20, 210);
            const lines = pdf.splitTextToSize(data.info || "Sin información adicional.", 170);
            pdf.text(lines, 20, 220);
            
            pdf.setFontSize(8); pdf.text(`Generado por ANDY BUSINESS - Para: ${cli}`, 105, 280, {align:"center"});
        });

        pdf.save(`Pedido_${cli}.pdf`);
        const wa = document.getElementById('cli-wa').value;
        if(wa) window.open(`https://wa.me/${wa}?text=Tu pack de láminas está listo 💎`, '_blank');
    };

    // --- NAVEGACIÓN ---
    window.login = async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value); } 
        catch(e) { alert("Acceso Denegado"); }
    };
    window.logout = () => signOut(auth);
    onAuthStateChanged(auth, u => {
        document.getElementById('login-screen').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
    });
    window.showSec = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
    };
</script>
</body>
</html>
