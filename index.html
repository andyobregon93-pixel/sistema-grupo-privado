<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA VIP ANDY - DASHBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root { --primary: #6366f1; --bg: #0a0c10; --card: #161b22; --text: #fff; --accent: #22c55e; --danger: #ef4444; --warning: #f59e0b; }
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);margin:0; overflow-x: hidden;}

/* --- NAVEGACIÓN TIPO MENÚ --- */
.sidebar { width: 100%; background: #111418; padding: 10px; display: flex; overflow-x: auto; gap: 10px; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100; scrollbar-width: none;}
.sidebar::-webkit-scrollbar { display: none; }
.nav-btn { background: #1f2937; color: #9ca3af; padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: 800; white-space: nowrap; border: 1px solid transparent; cursor: pointer; transition: 0.3s; }
.nav-btn.active { background: var(--primary); color: white; border-color: #818cf8; }

.container{padding:15px; max-width: 800px; margin: auto;}
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* --- COMPONENTES --- */
.card{background:var(--card);padding:20px;border-radius:20px;margin-top:15px; border: 1px solid #30363d;}
input,button,select{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:none; box-sizing: border-box; font-family: inherit;}
input, select{background:#0d1117;color:white;border:1px solid #30363d}
button{background:var(--primary);color:white;font-weight:800; cursor: pointer;}

/* --- TABLAS Y DETALLES --- */
.table-container { width: 100%; overflow-x: auto; border-radius: 12px; background: #0d1117; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px; }
th { background: #1f2937; color: var(--primary); padding: 12px; text-align: left; }
td { padding: 12px; border-bottom: 1px solid #1f2937; vertical-align: middle; }

.datos-detalle { display: block; background: #0a0c10; color: var(--accent); padding: 8px; border-radius: 8px; font-family: monospace; font-size: 11px; margin-top: 5px; border: 1px dashed #30363d; }
.btn-small { width: auto; padding: 6px 10px; font-size: 10px; margin: 2px; }
.badge { padding: 3px 8px; border-radius: 6px; font-weight: bold; }

.logout{background:var(--danger); width: auto; padding: 8px 15px; font-size: 12px; margin-left: auto;}
.btn-clear { background: var(--danger); font-size: 12px; margin-top: 15px; width: auto; padding: 10px 20px; }
</style>
</head>

<body>

<div id="login" class="container">
    <div class="card" style="text-align: center; margin-top: 50px;">
        <h1>⚡ ANDY VIP</h1>
        <input id="log-email" placeholder="Usuario">
        <input id="log-pass" type="password" placeholder="Clave">
        <button onclick="handleLogin()">INGRESAR AL SISTEMA</button>
    </div>
</div>

<div id="app" style="display:none">
    
    <div class="sidebar">
        <button class="nav-btn active" onclick="showPage('p-solicitar', this)">🎁 Pedir Cuenta</button>
        <button class="nav-btn admin-only" onclick="showPage('p-cuentas', this)">📺 Cuentas/Stock</button>
        <button class="nav-btn admin-only" onclick="showPage('p-pedidos', this)">📊 Historial Pedidos</button>
        <button class="nav-btn admin-only" onclick="showPage('p-miembros', this)">👥 Miembros</button>
        <button class="nav-btn admin-only" onclick="showPage('p-admin', this)">🔑 Accesos</button>
        <button class="logout" onclick="logout()">Salir</button>
    </div>

    <div class="container">
        
        <div id="p-solicitar" class="page active">
            <div class="card">
                <h3>Obtener nueva cuenta</h3>
                <select id="select-miembro"><option>Cargando...</option></select>
                <select id="select-plataforma"><option>Cargando...</option></select>
                <button onclick="pedirCuenta()">OBTENER AHORA</button>
                <div id="resultado-entrega"></div>
            </div>
        </div>

        <div id="p-cuentas" class="page">
            <div class="card">
                <h3>Agregar Plataforma</h3>
                <input id="c-app" placeholder="Nombre App">
                <input id="c-datos" placeholder="Correo:Clave / Datos detallados">
                <input id="c-cupo" type="number" placeholder="Stock">
                <button onclick="addCuenta()" style="background:var(--accent)">Subir al sistema</button>
            </div>
            <div class="card">
                <h3>Inventario Detallado</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Información de Cuenta</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="lista-cuentas-admin"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="p-pedidos" class="page">
            <div class="card">
                <h3>Historial de Entregas</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Miembro</th>
                                <th>Plataforma</th>
                                <th>Teléfono</th>
                                <th>Hora</th>
                            </tr>
                        </thead>
                        <tbody id="historial-tabla-body"></tbody>
                    </table>
                </div>
                <button class="btn-clear" onclick="limpiarHistorial()">🗑️ Vaciar Historial Completo</button>
            </div>
        </div>

        <div id="p-miembros" class="page">
            <div class="card">
                <h3>Registrar Nuevo Miembro</h3>
                <input id="m-nombre" placeholder="Nombre">
                <input id="m-phone" placeholder="Celular">
                <button onclick="addMiembro()">Guardar Miembro</button>
                <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
                <div id="lista-miembros-admin"></div>
            </div>
        </div>

        <div id="p-admin" class="page">
            <div class="card">
                <h3>Crear Admin o Seller</h3>
                <input id="new-email" placeholder="Correo">
                <input id="new-pass" placeholder="Clave">
                <select id="new-role">
                    <option value="seller">SELLER</option>
                    <option value="admin">ADMINISTRADOR</option>
                </select>
                <button onclick="crearUsuario()">Crear Acceso</button>
            </div>
        </div>

    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, getDocs, query, where, deleteDoc, doc, updateDoc, serverTimestamp, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:"AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
    authDomain:"sistema-ventas-64a4c.firebaseapp.com",
    projectId:"sistema-ventas-64a4c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const MASTER = "andyobregon799@gmail.com";

window.showPage = (id, btn) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
};

window.handleLogin = async () => {
    try {
        await signInWithEmailAndPassword(auth, document.getElementById("log-email").value, document.getElementById("log-pass").value);
    } catch(e) { alert("Acceso denegado"); }
};

window.logout = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, (user) => {
    if(user) {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
        if(user.email === MASTER) {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            loadAdminData();
        } else {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        }
        loadUserData();
    }
});

function loadUserData() {
    onSnapshot(collection(db, "miembros"), (snap) => {
        let html = '<option value="">-- Selecciona tu nombre --</option>';
        snap.forEach(d => { html += `<option value="${d.id}" data-phone="${d.data().telefono}">${d.data().nombre}</option>`; });
        document.getElementById("select-miembro").innerHTML = html;
    });
    onSnapshot(collection(db, "cuentas"), (snap) => {
        let html = '<option value="">-- Selecciona Plataforma --</option>';
        snap.forEach(d => { if(d.data().cupo > 0) html += `<option value="${d.id}">${d.data().app} (${d.data().cupo})</option>`; });
        document.getElementById("select-plataforma").innerHTML = html;
    });
}

window.pedirCuenta = async () => {
    const mSel = document.getElementById("select-miembro");
    const cId = document.getElementById("select-plataforma").value;
    if(!mSel.value || !cId) return alert("Faltan datos");

    const mNom = mSel.options[mSel.selectedIndex].text;
    const mPho = mSel.options[mSel.selectedIndex].getAttribute("data-phone");

    const snap = await getDocs(collection(db, "cuentas"));
    let cData = null;
    snap.forEach(d => { if(d.id === cId) cData = {id:d.id, ...d.data()}; });

    if(cData && cData.cupo > 0) {
        await addDoc(collection(db, "historial"), { miembro: mNom, telefono: mPho, app: cData.app, fecha: serverTimestamp() });
        await updateDoc(doc(db, "cuentas", cId), { cupo: cData.cupo - 1 });
        document.getElementById("resultado-entrega").innerHTML = `
        <div class="card" style="border-color:var(--accent); text-align:center;">
            <p>✅ CUENTA ENTREGADA:</p>
            <code id="copy-text" style="display:block; background:#000; padding:10px; margin-bottom:10px; color:var(--accent);">${cData.datos}</code>
            <button onclick="navigator.clipboard.writeText(document.getElementById('copy-text').innerText); alert('Copiado');">COPIAR DATOS 📋</button>
        </div>`;
    }
};

function loadAdminData() {
    onSnapshot(collection(db, "cuentas"), snap => {
        let html = "";
        snap.forEach(d => {
            const c = d.data();
            html += `<tr>
                <td>
                    <b>${c.app}</b>
                    <span class="datos-detalle">${c.datos}</span>
                </td>
                <td><span class="badge" style="background:#334155">${c.cupo}</span></td>
                <td>
                    <button class="btn-small" style="background:var(--warning)" onclick="editarCuenta('${d.id}','${c.app}','${c.datos}')">✎</button>
                    <button class="btn-small" style="background:#3b82f6" onclick="resetCupo('${d.id}')">Cupo</button>
                    <button class="btn-small" style="background:var(--danger)" onclick="eliminarDoc('cuentas','${d.id}')">X</button>
                </td>
            </tr>`;
        });
        document.getElementById("lista-cuentas-admin").innerHTML = html;
    });

    onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc")), snap => {
        let html = "";
        snap.forEach(d => {
            const h = d.data();
            html += `<tr><td>${h.miembro}</td><td><span class="badge" style="background:var(--primary)">${h.app}</span></td><td>${h.telefono}</td><td>${h.fecha?.toDate().toLocaleTimeString() || '...'}</td></tr>`;
        });
        document.getElementById("historial-tabla-body").innerHTML = html;
    });

    onSnapshot(collection(db, "miembros"), snap => {
        let html = "";
        snap.forEach(d => {
            html += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #1f2937;">
                <span>👤 ${d.data().nombre} (${d.data().telefono})</span>
                <button class="btn-small" style="background:var(--danger)" onclick="eliminarDoc('miembros','${d.id}')">Borrar</button>
            </div>`;
        });
        document.getElementById("lista-miembros-admin").innerHTML = html;
    });
}

window.limpiarHistorial = async () => {
    if(confirm("¿Estás seguro de eliminar TODO el historial de pedidos? Esta acción no se puede deshacer.")){
        const q = await getDocs(collection(db, "historial"));
        const batch = writeBatch(db);
        q.forEach((document) => { batch.delete(document.ref); });
        await batch.commit();
        alert("Historial vaciado correctamente.");
    }
};

window.addCuenta = async () => {
    const app = document.getElementById("c-app").value;
    const datos = document.getElementById("c-datos").value;
    const cupo = parseInt(document.getElementById("c-cupo").value);
    if(app && datos && !isNaN(cupo)) await addDoc(collection(db, "cuentas"), { app, datos, cupo });
};

window.addMiembro = async () => {
    const n = document.getElementById("m-nombre").value;
    const t = document.getElementById("m-phone").value;
    if(n && t) await addDoc(collection(db, "miembros"), { nombre:n, telefono:t });
};

window.editarCuenta = async (id, app, datos) => {
    const nA = prompt("App:", app);
    const nD = prompt("Datos:", datos);
    if(nA && nD) await updateDoc(doc(db, "cuentas", id), { app: nA, datos: nD });
};

window.resetCupo = async (id) => {
    const nC = prompt("Nuevo Stock:");
    if(nC) await updateDoc(doc(db, "cuentas", id), { cupo: parseInt(nC) });
};

window.eliminarDoc = async (p, id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, p, id)); };

window.crearUsuario = async () => {
    const e = document.getElementById("new-email").value;
    const p = document.getElementById("new-pass").value;
    try { await createUserWithEmailAndPassword(auth, e, p); alert("Usuario Creado"); } catch(err) { alert(err.message); }
};
</script>

</body>
</html>
