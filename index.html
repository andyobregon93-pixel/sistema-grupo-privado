<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDY GLOBAL | Premium Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0c10; --card: #161b22; --accent: #6366f1; 
            --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
            --border: #30363d; --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }

        .header { padding: 25px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, #111827, var(--bg)); }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .badge-role { font-size: 0.6rem; background: var(--accent); padding: 2px 8px; border-radius: 10px; margin-left: 5px; vertical-align: middle; text-transform: uppercase; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: #8b949e; font-size: 0.6rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: var(--accent); }

        .container { padding: 20px; max-width: 500px; margin: auto; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: #0d1117; color: white; }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 5px; }
        
        /* ITEMS DE LISTA */
        .list-item { background: #0d1117; padding: 15px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; }
        .actions-row { display: flex; gap: 5px; margin-top: 10px; }
        .btn-action { flex: 1; padding: 8px; border-radius: 8px; border: none; font-size: 0.65rem; font-weight: 700; color: white; cursor: pointer; }
        
        /* LOGS */
        .log-entry { font-size: 0.75rem; padding: 10px; border-bottom: 1px solid var(--border); }
        .log-entry b { color: var(--accent); }
        .log-time { font-size: 0.6rem; color: #8b949e; display: block; }

        #result-box { display: none; background: #065f46; padding: 20px; border-radius: 15px; text-align: center; margin-top: 15px; border: 2px dashed var(--success); }
        .copy-text { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-family: monospace; margin: 10px 0; display: block; }
    </style>
</head>
<body>

<div id="login-scr" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 30px;">
    <div class="glass-card" style="width: 100%; text-align: center;">
        <h1 style="color: var(--accent); font-size: 2rem;">ANDY GLOBAL</h1>
        <input type="email" id="log-email" placeholder="Correo corporativo">
        <input type="password" id="log-pass" placeholder="Contraseña">
        <button onclick="handleLogin()" class="btn-main">ACCEDER AL PANEL</button>
    </div>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1 id="user-display">Panel Activo</h1>
        <p style="font-size: 0.7rem; color: #8b949e;">Gestión de Activaciones v3.0</p>
    </div>

    <div class="container">
        <div id="sec-user" class="section active">
            <div class="glass-card">
                <h3>📱 Entrega de Cuentas</h3>
                <input type="text" id="cust-name" placeholder="Nombre del Cliente (WhatsApp)">
                <select id="user-platforms-select"><option value="">Selecciona Servicio...</option></select>
                <button onclick="deliverAccount()" class="btn-main" style="background: var(--success);">GENERAR ACTIVACIÓN ✅</button>
                <div id="result-box">
                    <b class="copy-text" id="account-data">CARGANDO...</b>
                    <button onclick="copyToClipboard()" class="btn-main" style="padding: 10px;">COPIAR DATOS 📋</button>
                </div>
            </div>
        </div>

        <div id="sec-iptv" class="section">
            <div class="glass-card">
                <h3>📦 Cargar Inventario</h3>
                <input type="text" id="iptv-name" placeholder="Nombre (Ej: IPTV PLATINUM)">
                <input type="text" id="iptv-creds" placeholder="Credenciales (u:p)">
                <input type="number" id="iptv-cupos" placeholder="Cupos disponibles">
                <button onclick="addStock()" class="btn-main">GUARDAR EN NUBE</button>
            </div>
            <div id="iptv-list"></div>
        </div>

        <div id="sec-team" class="section">
            <div class="glass-card">
                <h3>👥 Gestión de Equipo</h3>
                <input type="text" id="team-name" placeholder="Nombre del Miembro">
                <input type="number" id="team-cupos" placeholder="Cupos asignados">
                <select id="team-role"><option value="Seller">Vendedor</option><option value="Admin">Administrador</option></select>
                <button onclick="addTeamMember()" class="btn-main">CREAR ACCESO</button>
            </div>
            <div id="team-list"></div>
        </div>

        <div id="sec-logs" class="section">
            <div class="glass-card">
                <h3>📊 Historial Completo</h3>
                <div id="log-container"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="nav('sec-user', this)"><span>📱</span>PEDIR</button>
        <button class="nav-btn" onclick="nav('sec-iptv', this)"><span>📦</span>STOCK</button>
        <button class="nav-btn" onclick="nav('sec-team', this)"><span>🛠️</span>EQUIPO</button>
        <button class="nav-btn" onclick="nav('sec-logs', this)"><span>📜</span>LOGS</button>
        <button class="nav-btn" onclick="handleLogout()"><span>🚪</span>SALIR</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp, getDocs, where, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.handleLogin = async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value); } 
        catch(e) { alert("Acceso Incorrecto"); }
    };
    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, u => {
        document.getElementById('login-scr').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
        if(u) {
            document.getElementById('user-display').innerHTML = `${u.email} <span class="badge-role">ACTIVO</span>`;
            loadData();
        }
    });

    function loadData() {
        // STOCK
        onSnapshot(collection(db, "iptv_stock"), snap => {
            const list = document.getElementById('iptv-list');
            const select = document.getElementById('user-platforms-select');
            list.innerHTML = ""; select.innerHTML = '<option value="">Selecciona Servicio...</option>';
            let seen = new Set();
            snap.forEach(d => {
                const i = d.data();
                if(i.cupos > 0 && !seen.has(i.nombre)) { select.innerHTML += `<option value="${i.nombre}">${i.nombre}</option>`; seen.add(i.nombre); }
                list.innerHTML += `<div class="list-item"><b>${i.nombre}</b> <span style="float:right; color:var(--gold)">Cupo: ${i.cupos}</span><br><small>${i.creds}</small>
                <div class="actions-row">
                    <button onclick="editCupo('${d.id}', ${i.cupos}, 'iptv_stock')" class="btn-action" style="background:var(--accent)">EDITAR</button>
                    <button onclick="deleteDoc(doc(db,'iptv_stock','${d.id}'))" class="btn-action" style="background:var(--danger)">BORRAR</button>
                </div></div>`;
            });
        });

        // EQUIPO
        onSnapshot(collection(db, "equipo_andy"), snap => {
            const list = document.getElementById('team-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                list.innerHTML += `<div class="list-item"><b>${m.nombre}</b> [${m.rol}]<br><small>Cupos Venta: ${m.cupos}</small>
                <div class="actions-row">
                    <button onclick="editCupo('${d.id}', ${m.cupos}, 'equipo_andy')" class="btn-action" style="background:var(--success)">+ CUPOS</button>
                    <button onclick="deleteDoc(doc(db,'equipo_andy','${d.id}'))" class="btn-action" style="background:var(--danger)">ELIMINAR</button>
                </div></div>`;
            });
        });

        // HISTORIAL
        onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc")), snap => {
            const cont = document.getElementById('log-container');
            cont.innerHTML = snap.docs.map(d => {
                const l = d.data();
                const f = l.fecha?.toDate().toLocaleString() || 'Ahora';
                return `<div class="log-entry"><span class="log-time">${f}</span>Admin <b>${l.admin}</b> ayudó a <b>${l.cliente}</b> con <b>${l.cuenta}</b></div>`;
            }).join('');
        });
    }

    // ACCIONES
    window.deliverAccount = async () => {
        const cli = document.getElementById('cust-name').value;
        const plat = document.getElementById('user-platforms-select').value;
        if(!cli || !plat) return alert("Completa los datos");

        const q = query(collection(db, "iptv_stock"), where("nombre", "==", plat), where("cupos", ">", 0), limit(1));
        const snap = await getDocs(q);
        if(snap.empty) return alert("Sin stock");

        const docRef = snap.docs[0];
        const data = docRef.data();

        document.getElementById('account-data').innerText = data.creds;
        document.getElementById('result-box').style.display = 'block';

        await updateDoc(doc(db, "iptv_stock", docRef.id), { cupos: data.cupos - 1 });
        await addDoc(collection(db, "historial"), { admin: auth.currentUser.email, cliente: cli, cuenta: plat, fecha: serverTimestamp() });
    };

    window.addStock = () => {
        const n = document.getElementById('iptv-name').value;
        const c = document.getElementById('iptv-creds').value;
        const cp = parseInt(document.getElementById('iptv-cupos').value);
        if(n && c) addDoc(collection(db, "iptv_stock"), { nombre: n, creds: c, cupos: cp });
    };

    window.addTeamMember = () => {
        const n = document.getElementById('team-name').value;
        const c = parseInt(document.getElementById('team-cupos').value);
        const r = document.getElementById('team-role').value;
        if(n) addDoc(collection(db, "equipo_andy"), { nombre: n, cupos: c, rol: r });
    };

    window.editCupo = async (id, actual, col) => {
        const n = prompt("Nuevo valor:", actual);
        if(n !== null) await updateDoc(doc(db, col, id), { cupos: parseInt(n) });
    };

    window.copyToClipboard = () => { navigator.clipboard.writeText(document.getElementById('account-data').innerText); alert("¡Copiado!"); };
    
    window.nav = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };
</script>
</body>
</html>
