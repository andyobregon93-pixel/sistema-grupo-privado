<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDY VIP | Admin Master Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #070b14; --card: #111827; --accent: #3b82f6; 
            --danger: #ef4444; --success: #10b981; --text: #f1f5f9; 
            --border: #1f2937; --gold: #f59e0b; --purple: #a855f7;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        .nav-bar { 
            display: flex; background: var(--card); padding: 10px; 
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent);
            justify-content: space-around; flex-wrap: wrap; gap: 5px;
        }
        .nav-btn { 
            padding: 8px 12px; border: none; background: transparent; 
            color: #94a3b8; font-weight: 600; cursor: pointer; transition: 0.3s;
            border-radius: 8px; font-size: 0.7rem;
        }
        .nav-btn.active { color: white; background: var(--accent); }

        .container { padding: 20px; max-width: 1000px; margin: auto; padding-bottom: 100px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid var(--border); background: #0f172a; color: white; box-sizing: border-box; 
        }
        
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .btn-save { background: var(--success); color: white; }
        .btn-edit { background: var(--gold); color: black; padding: 5px 8px; border-radius: 5px; border:none; font-size: 0.7rem; cursor:pointer;}
        .btn-delete { background: var(--danger); color: white; padding: 5px 8px; border-radius: 5px; border:none; cursor:pointer;}
        
        /* ESTILOS CARICATURAS */
        .art-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .art-item { 
            background: #1e293b; border-radius: 10px; padding: 10px; text-align: center;
            border: 2px solid transparent; cursor: pointer;
        }
        .art-item.selected { border-color: var(--success); background: #064e3b; }
        .art-item img { width: 100%; height: 100px; object-fit: contain; background: white; border-radius: 5px; }

        #factura-render { 
            width: 350px; background: white; color: #000; padding: 30px; 
            position: absolute; left: -9999px; font-family: 'Courier New', monospace;
        }

        .cart-bar {
            position: fixed; bottom: 0; left:0; right:0; background: var(--card);
            padding: 15px; border-top: 2px solid var(--success); display: none;
            justify-content: space-between; align-items: center; z-index: 2000;
        }
    </style>
</head>
<body>

<div id="login-box" style="display: flex; height: 100vh; align-items: center; justify-content: center;">
    <div class="card" style="width:320px; text-align:center; border: 2px solid var(--accent);">
        <h1 style="color:var(--accent); margin:0;">ANDY VIP</h1>
        <p style="font-size:0.8rem; color:#64748b;">MASTER ADMIN PANEL</p>
        <input type="email" id="email" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()" class="btn-main btn-save">INGRESAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showTab('tab-staff', this)">👷 STAFF</button>
        <button class="nav-btn" onclick="showTab('tab-art', this)">🎨 ART</button>
        <button class="nav-btn" onclick="showTab('tab-clientes', this)">👥 CLIENTES</button>
        <button class="nav-btn" onclick="showTab('tab-deudores', this)">💸 DEUDORES</button>
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">SALIR</button>
    </div>

    <div class="container">
        
        <div id="tab-art" class="section">
            <div class="card">
                <h3>🎨 Generador de Pack Imprimible</h3>
                <input type="text" id="art-cliente" placeholder="Nombre del Cliente">
                <input type="text" id="art-wa" placeholder="WhatsApp (593...)">
                <p style="font-size: 0.8rem; color: var(--gold);">Selecciona las caricaturas para el PDF:</p>
                <div id="galeria-art" class="art-grid">
                    </div>
            </div>
        </div>

        <div id="tab-staff" class="section active">
            <div class="card">
                <h3 id="staff-form-title">👷 Registrar Personal</h3>
                <input type="hidden" id="s-id">
                <input type="text" id="s-nombre" placeholder="Nombre completo">
                <input type="text" id="s-movil" placeholder="WhatsApp (Ej: 521...)">
                <textarea id="s-pago" placeholder="Métodos de pago..."></textarea>
                <div class="grid-inputs">
                    <div><small>Próximo Pago</small><input type="date" id="s-fecha"></div>
                    <div><small>Sueldo/Corte</small><input type="number" id="s-monto" placeholder="$0.00"></div>
                </div>
                <button onclick="guardarStaff()" id="btn-staff-save" class="btn-main btn-save">GUARDAR TRABAJADOR</button>
            </div>
            <div id="lista-staff"></div>
        </div>

        <div id="tab-clientes" class="section">
            <div class="card"><h3>👥 Clientes VIP</h3></div>
            <div id="lista-clientes-full"></div>
        </div>

        <div id="tab-deudores" class="section">
            <div class="card"><h3>💸 Deudores</h3></div>
            <div id="lista-deudores"></div>
        </div>

    </div>
</div>

<div id="cart-bar" class="cart-bar">
    <div><b id="art-count">0</b> Dibujos seleccionados</div>
    <button onclick="descargarPackPDF()" class="btn-main btn-save" style="width:auto; padding: 10px 20px;">PDF ✅</button>
</div>

<div id="factura-render"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // TU CONFIGURACIÓN ORIGINAL (NO SE TOCA)
    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- LÓGICA DE CARICATURAS (NUEVA) ---
    const catalogo = [
        { id: 101, nombre: "Goku", url: "https://i.pinimg.com/originals/1b/4f/f5/1b4ff5f0f353a25f829f27d5885c4f21.jpg" },
        { id: 102, nombre: "Mickey", url: "https://dbdzm869oupei.cloudfront.net/img/sticker/preview/13012.png" },
        { id: 103, nombre: "Spider-man", url: "https://www.supercolorear.com/wp-content/uploads/2023/04/spiderman-colorear.jpg" }
    ];
    let seleccionados = [];

    window.renderArt = () => {
        const galery = document.getElementById('galeria-art');
        galery.innerHTML = "";
        catalogo.forEach(item => {
            const isSel = seleccionados.includes(item.id);
            galery.innerHTML += `
                <div class="art-item ${isSel?'selected':''}" onclick="toggleArt(${item.id})">
                    <img src="${item.url}">
                    <p style="font-size:0.7rem; margin-top:5px;">${item.nombre}</p>
                </div>`;
        });
    };

    window.toggleArt = (id) => {
        const idx = seleccionados.indexOf(id);
        if(idx > -1) seleccionados.splice(idx, 1);
        else seleccionados.push(id);
        
        document.getElementById('art-count').innerText = seleccionados.length;
        document.getElementById('cart-bar').style.display = seleccionados.length > 0 ? 'flex' : 'none';
        renderArt();
    };

    window.descargarPackPDF = async () => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const cliente = document.getElementById('art-cliente').value || "Cliente";
        
        pdf.text("ANDY ART - PACK PARA COLOREAR", 10, 10);
        pdf.text(`Cliente: ${cliente}`, 10, 20);

        for (let id of seleccionados) {
            const item = catalogo.find(x => x.id === id);
            pdf.addPage();
            try { pdf.addImage(item.url, 'JPEG', 10, 10, 190, 260); } catch(e) {}
        }
        pdf.save(`Pack_${cliente}.pdf`);
        
        const wa = document.getElementById('art-wa').value;
        if(wa) {
            window.open(`https://wa.me/${wa}?text=*ANDY ART*%0AHe generado tu pack de ${seleccionados.length} dibujos. ✅`, '_blank');
        }
    };

    // --- NAVEGACIÓN Y LOGIN (ORIGINAL) ---
    window.login = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Credenciales incorrectas"); }
    };
    window.logout = () => signOut(auth);
    
    onAuthStateChanged(auth, u => {
        document.getElementById('login-box').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
        if(u) renderArt();
    });

    window.showTab = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
        document.getElementById('cart-bar').style.display = (id === 'tab-art' && seleccionados.length > 0) ? 'flex' : 'none';
    };

    // (El resto de funciones como guardarStaff se mantienen igual que en tu código anterior...)
</script>
</body>
</html>
