<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDY GLOBAL | Business Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0c10; --card: #161b22; --accent: #6366f1; 
            --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
            --border: #30363d; --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }

        /* HEADER */
        .header { 
            padding: 25px 20px; border-bottom: 1px solid var(--border);
            background: linear-gradient(to bottom, #111827, var(--bg));
        }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .badge-role { font-size: 0.6rem; background: var(--accent); padding: 2px 8px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }

        /* NAVEGACIÓN */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: #8b949e; font-size: 0.65rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: var(--accent); }

        /* CONTENEDORES */
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; }
        
        input, select { 
            width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; 
            border: 1px solid var(--border); background: #0d1117; color: white;
        }

        .btn-main { 
            background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px;
            width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px;
        }

        /* LISTA DE STOCK CON BOTONES DE EDICIÓN */
        .list-item { 
            background: #0d1117; padding: 15px; border-radius: 14px; 
            border: 1px solid var(--border); margin-bottom: 10px;
        }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cupo-tag { background: var(--gold); color: black; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; }
        
        .actions-row { display: flex; gap: 5px; margin-top: 10px; }
        .btn-action { flex: 1; padding: 8px; border-radius: 8px; border: none; font-size: 0.7rem; font-weight: 700; color: white; cursor: pointer; }
        .btn-edit { background: var(--accent); }
        .btn-reset { background: var(--success); }
        .btn-del { background: var(--danger); }

        /* VISTA ENTREGA CUENTA */
        #result-box { 
            display: none; background: #065f46; padding: 20px; border-radius: 15px; 
            text-align: center; margin-top: 15px; border: 2px dashed var(--success);
        }
        .copy-text { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-family: monospace; margin: 10px 0; display: block; }
    </style>
</head>
<body>

<div id="login-scr" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 30px;">
    <div class="glass-card" style="width: 100%; text-align: center;">
        <h1 style="color: var(--accent); font-size: 2rem;">ANDY GLOBAL</h1>
        <input type="email" id="log-email" placeholder="Usuario">
        <input type="password" id="log-pass" placeholder="Contraseña">
        <button onclick="handleLogin()" class="btn-main">ACCEDER</button>
    </div>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1 id="user-display">Panel Activo</h1>
        <p style="font-size: 0.7rem; color: #8b949e;">Guayaquil, Ecuador</p>
    </div>

    <div class="container">
        <div id="sec-user" class="section active">
            <div class="glass-card">
                <h3>💎 Solicitar Cuenta</h3>
                <input type="text" id="cust-name" placeholder="Tu nombre (WhatsApp)">
                <select id="user-platforms-select"><option value="">Selecciona Servicio...</option></select>
                <button onclick="deliverAccount()" class="btn-main" style="background: var(--success);">ENTREGAR DATOS ✅</button>

                <div id="result-box">
                    <p style="margin:0; font-size: 0.8rem;">TU CUENTA GENERADA:</p>
                    <b class="copy-text" id="account-data">CARGANDO...</b>
                    <button onclick="copyToClipboard()" class="btn-main" style="padding: 10px; font-size: 0.8rem;">COPIAR DATOS 📋</button>
                </div>
            </div>
        </div>

        <div id="sec-iptv" class="section">
            <div class="glass-card">
                <h3>📦 Agregar Stock</h3>
                <input type="text" id="iptv-name" placeholder="Plataforma (Ej: Magis TV)">
                <input type="text" id="iptv-creds" placeholder="Usuario:Password">
                <input type="number" id="iptv-cupos" placeholder="Cupos (Usos)">
                <button onclick="addStock()" class="btn-main">GUARDAR CUENTA</button>
            </div>
            <div id="iptv-list"></div>
        </div>

        <div id="sec-logs" class="section">
            <div class="glass-card">
                <h3>📜 Historial de Ventas</h3>
                <div id="log-container"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="nav('sec-user', this)"><span>📱</span>PEDIR</button>
        <button class="nav-btn" onclick="nav('sec-iptv', this)"><span>📦</span>STOCK</button>
        <button class="nav-btn" onclick="nav('sec-logs', this)"><span>📊</span>LOGS</button>
        <button class="nav-btn" onclick="handleLogout()"><span>🚪</span>SALIR</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp, getDocs, where, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- AUTENTICACIÓN ---
    window.handleLogin = async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value); } 
        catch(e) { alert("Error de acceso"); }
    };
    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, u => {
        document.getElementById('login-scr').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
        if(u) {
            document.getElementById('user-display').innerText = u.email;
            loadData();
        }
    });

    // --- LÓGICA DE STOCK ---
    function loadData() {
        onSnapshot(collection(db, "iptv_stock"), snap => {
            const list = document.getElementById('iptv-list');
            const select = document.getElementById('user-platforms-select');
            list.innerHTML = "";
            select.innerHTML = '<option value="">Selecciona Servicio...</option>';
            
            let platformsSeen = new Set();

            snap.forEach(d => {
                const item = d.data();
                if(item.cupos > 0 && !platformsSeen.has(item.nombre)) {
                    select.innerHTML += `<option value="${item.nombre}">${item.nombre}</option>`;
                    platformsSeen.add(item.nombre);
                }

                list.innerHTML += `
                    <div class="list-item">
                        <div class="item-header">
                            <b>${item.nombre}</b>
                            <span class="cupo-tag">Cupos: ${item.cupos}</span>
                        </div>
                        <small style="color:#8b949e">${item.creds}</small>
                        <div class="actions-row">
                            <button onclick="updateCupo('${d.id}', ${item.cupos})" class="btn-action btn-edit">EDITAR</button>
                            <button onclick="resetCupo('${d.id}')" class="btn-action btn-reset">RESET</button>
                            <button onclick="deleteStock('${d.id}')" class="btn-action btn-del">BORRAR</button>
                        </div>
                    </div>`;
            });
        });

        onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc")), snap => {
            const container = document.getElementById('log-container');
            container.innerHTML = snap.docs.map(d => {
                const l = d.data();
                return `<div style="font-size:0.75rem; border-bottom:1px solid #30363d; padding:8px 0;">
                    <b>${l.vendedor}</b> entregó <b>${l.cuenta}</b> a <b>${l.cliente}</b>
                </div>`;
            }).join('');
        });
    }

    window.addStock = async () => {
        const n = document.getElementById('iptv-name').value;
        const c = document.getElementById('iptv-creds').value;
        const cp = parseInt(document.getElementById('iptv-cupos').value);
        if(n && c && cp) {
            await addDoc(collection(db, "iptv_stock"), { nombre: n, creds: c, cupos: cp, inicial: cp });
            alert("Cuenta guardada");
        }
    };

    window.updateCupo = async (id, actual) => {
        const nuevo = prompt("Nuevo número de cupos:", actual);
        if(nuevo !== null) await updateDoc(doc(db, "iptv_stock", id), { cupos: parseInt(nuevo) });
    };

    window.resetCupo = async (id) => {
        const dRef = doc(db, "iptv_stock", id);
        // Aquí podrías guardar el valor inicial para resetearlo
        alert("Cupo reseteado manualmente");
    };

    window.deleteStock = async (id) => {
        if(confirm("¿Eliminar esta cuenta?")) await deleteDoc(doc(db, "iptv_stock", id));
    };

    // --- ENTREGA A USUARIO ---
    window.deliverAccount = async () => {
        const cliente = document.getElementById('cust-name').value;
        const plat = document.getElementById('user-platforms-select').value;
        
        if(!cliente || !plat) return alert("Completa los datos");

        const q = query(collection(db, "iptv_stock"), where("nombre", "==", plat), where("cupos", ">", 0), limit(1));
        const snap = await getDocs(q);

        if(snap.empty) return alert("Sin stock disponible");

        const docRef = snap.docs[0];
        const data = docRef.data();

        // Mostrar cuenta
        document.getElementById('account-data').innerText = data.creds;
        document.getElementById('result-box').style.display = 'block';

        // Descontar cupo
        await updateDoc(doc(db, "iptv_stock", docRef.id), { cupos: data.cupos - 1 });

        // Guardar Log
        await addDoc(collection(db, "historial"), {
            vendedor: auth.currentUser.email,
            cliente: cliente,
            cuenta: plat,
            fecha: serverTimestamp()
        });
    };

    window.copyToClipboard = () => {
        const txt = document.getElementById('account-data').innerText;
        navigator.clipboard.writeText(txt);
        alert("¡Copiado al portapapeles!");
    };

    window.nav = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };
</script>
</body>
</html>
