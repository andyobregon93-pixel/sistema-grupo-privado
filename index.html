<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDY GLOBAL | Ultra Fast Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0a0c10; --card: #161b22; --accent: #6366f1; 
            --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
            --border: #30363d; --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; transition: all 0.2s ease; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 90px; }

        .header { padding: 25px 20px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, #111827, var(--bg)); }
        .header h1 { margin: 0; font-size: 1.4rem; font-weight: 800; color: var(--accent); }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: #8b949e; font-size: 0.6rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: var(--accent); transform: scale(1.1); }

        .container { padding: 20px; max-width: 500px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; animation: quickIn 0.2s forwards; }
        @keyframes quickIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: #0d1117; color: white; font-size: 16px; }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; }
        
        .list-item { background: #0d1117; padding: 15px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; }
        .actions-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
        .btn-action { padding: 8px; border-radius: 8px; border: none; font-size: 0.6rem; font-weight: 800; color: white; cursor: pointer; text-transform: uppercase; }
        
        #result-box { display: none; background: #065f46; padding: 20px; border-radius: 15px; text-align: center; margin-top: 15px; border: 2px solid var(--success); }
        .copy-text { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; font-family: monospace; margin: 10px 0; display: block; font-size: 1.1rem; border: 1px solid var(--success); }
    </style>
</head>
<body>

<div id="login-scr" style="display: flex; height: 100vh; align-items: center; justify-content: center; padding: 30px;">
    <div class="glass-card" style="width: 100%; text-align: center;">
        <h1 style="color: var(--accent); font-size: 2.2rem;">ANDY GLOBAL</h1>
        <input type="email" id="log-email" placeholder="Usuario">
        <input type="password" id="log-pass" placeholder="Password">
        <button onclick="handleLogin()" class="btn-main">ENTRAR YA</button>
    </div>
</div>

<div id="app" style="display: none;">
    <div class="header">
        <h1 id="user-display">Cargando...</h1>
    </div>

    <div class="container">
        <div id="sec-user" class="section active">
            <div class="glass-card">
                <h3>⚡ Entrega Instantánea</h3>
                <input type="text" id="cust-name" placeholder="Nombre del Cliente">
                <select id="user-platforms-select"><option value="">Selecciona Servicio...</option></select>
                <button onclick="deliverAccount()" class="btn-main" style="background: var(--success);">ENTREGAR CUENTA ✅</button>
                <div id="result-box">
                    <b class="copy-text" id="account-data">...</b>
                    <button onclick="copyToClipboard()" class="btn-main" style="padding: 10px; background: white; color: black;">COPIAR DATOS 📋</button>
                </div>
            </div>
        </div>

        <div id="sec-iptv" class="section">
            <div class="glass-card">
                <h3>📦 Nuevo Stock</h3>
                <input type="text" id="iptv-name" placeholder="Servicio">
                <input type="text" id="iptv-creds" placeholder="User:Pass">
                <input type="number" id="iptv-cupos" placeholder="Cupos Iniciales">
                <button onclick="addStock()" class="btn-main">SUBIR STOCK</button>
            </div>
            <div id="iptv-list"></div>
        </div>

        <div id="sec-team" class="section">
            <div class="glass-card">
                <h3>👥 Usuarios Sistema</h3>
                <input type="text" id="team-name" placeholder="Nombre">
                <input type="number" id="team-cupos" placeholder="Cupos asignados">
                <button onclick="addTeamMember()" class="btn-main">CREAR ACCESO</button>
            </div>
            <div id="team-list"></div>
        </div>

        <div id="sec-logs" class="section">
            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>📜 Historial</h3>
                    <button onclick="clearLogs()" style="background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.6rem;">BORRAR TODO</button>
                </div>
                <div id="log-container"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="nav('sec-user', this)"><span>📱</span>PEDIR</button>
        <button class="nav-btn" onclick="nav('sec-iptv', this)"><span>📦</span>STOCK</button>
        <button class="nav-btn" onclick="nav('sec-team', this)"><span>🛠️</span>EQUIPO</button>
        <button class="nav-btn" onclick="nav('sec-logs', this)"><span>📜</span>LOGS</button>
        <button class="nav-btn" onclick="handleLogout()"><span>🚪</span>SALIR</button>
    </nav>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp, getDocs, where, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // LOGIN RÁPIDO
    window.handleLogin = async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value); } 
        catch(e) { alert("Error"); }
    };
    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, u => {
        document.getElementById('login-scr').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
        if(u) {
            document.getElementById('user-display').innerHTML = `HOLA, ${u.email.split('@')[0].toUpperCase()}`;
            loadData();
        }
    });

    function loadData() {
        // STOCK DINÁMICO
        onSnapshot(collection(db, "iptv_stock"), snap => {
            const list = document.getElementById('iptv-list');
            const select = document.getElementById('user-platforms-select');
            list.innerHTML = ""; select.innerHTML = '<option value="">Selecciona Servicio...</option>';
            let platforms = new Set();
            snap.forEach(d => {
                const i = d.data();
                if(i.cupos > 0 && !platforms.has(i.nombre)) { select.innerHTML += `<option value="${i.nombre}">${i.nombre}</option>`; platforms.add(i.nombre); }
                list.innerHTML += `<div class="list-item"><b>${i.nombre}</b> <span style="float:right; color:var(--gold)">CP: ${i.cupos}</span><br><small>${i.creds}</small>
                <div class="actions-row">
                    <button onclick="editVal('${d.id}', ${i.cupos}, 'iptv_stock')" class="btn-action" style="background:var(--accent)">EDITAR</button>
                    <button onclick="resetVal('${d.id}', ${i.inicial || i.cupos})" class="btn-action" style="background:var(--success)">RESET</button>
                    <button onclick="deleteDoc(doc(db,'iptv_stock','${d.id}'))" class="btn-action" style="background:var(--danger)">BORRAR</button>
                </div></div>`;
            });
        });

        // EQUIPO
        onSnapshot(collection(db, "equipo_andy"), snap => {
            const list = document.getElementById('team-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                list.innerHTML += `<div class="list-item"><b>${m.nombre}</b><br><small>Cupos: ${m.cupos}</small>
                <div class="actions-row">
                    <button onclick="editVal('${d.id}', ${m.cupos}, 'equipo_andy')" class="btn-action" style="background:var(--accent)">EDITAR</button>
                    <button onclick="deleteDoc(doc(db,'equipo_andy','${d.id}'))" class="btn-action" style="background:var(--danger)">X</button>
                </div></div>`;
            });
        });

        // HISTORIAL
        onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc")), snap => {
            const cont = document.getElementById('log-container');
            cont.innerHTML = snap.docs.map(d => {
                const l = d.data();
                return `<div style="font-size:0.7rem; border-bottom:1px solid #333; padding:5px 0;"><b>${l.admin}</b> -> ${l.cliente} (<b>${l.cuenta}</b>)</div>`;
            }).join('');
        });
    }

    // ENTREGA VELOZ
    window.deliverAccount = async () => {
        const cli = document.getElementById('cust-name').value;
        const plat = document.getElementById('user-platforms-select').value;
        if(!cli || !plat) return alert("Faltan datos");

        const q = query(collection(db, "iptv_stock"), where("nombre", "==", plat), where("cupos", ">", 0), limit(1));
        const snap = await getDocs(q);
        if(snap.empty) return alert("Sin stock");

        const docRef = snap.docs[0];
        const data = docRef.data();

        // ENTREGA AL INSTANTE
        document.getElementById('account-data').innerText = data.creds;
        document.getElementById('result-box').style.display = 'block';

        // PROCESO EN SEGUNDO PLANO (NO DETIENE LA ENTREGA)
        updateDoc(doc(db, "iptv_stock", docRef.id), { cupos: data.cupos - 1 });
        addDoc(collection(db, "historial"), { admin: auth.currentUser.email.split('@')[0], cliente: cli, cuenta: plat, fecha: serverTimestamp() });
    };

    // FUNCIONES DE CONTROL
    window.addStock = () => {
        const n = document.getElementById('iptv-name').value.toUpperCase();
        const c = document.getElementById('iptv-creds').value;
        const cp = parseInt(document.getElementById('iptv-cupos').value);
        if(n && c) addDoc(collection(db, "iptv_stock"), { nombre: n, creds: c, cupos: cp, inicial: cp });
    };

    window.addTeamMember = () => {
        const n = document.getElementById('team-name').value;
        const c = parseInt(document.getElementById('team-cupos').value);
        if(n) addDoc(collection(db, "equipo_andy"), { nombre: n, cupos: c });
    };

    window.editVal = async (id, actual, col) => {
        const n = prompt("Nuevo Valor:", actual);
        if(n !== null) await updateDoc(doc(db, col, id), { cupos: parseInt(n) });
    };

    window.resetVal = async (id, inicial) => {
        await updateDoc(doc(db, "iptv_stock", id), { cupos: inicial });
        alert("Cupos reseteados");
    };

    window.clearLogs = async () => {
        if(confirm("¿Borrar todo el historial?")) {
            const snap = await getDocs(collection(db, "historial"));
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
    };

    window.copyToClipboard = () => {
        navigator.clipboard.writeText(document.getElementById('account-data').innerText);
        alert("¡Copiado!");
    };

    window.nav = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };
</script>
</body>
</html>
