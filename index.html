<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA VIP ANDY - DASHBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root { --primary: #6366f1; --bg: #0a0c10; --card: #161b22; --text: #fff; --accent: #22c55e; --danger: #ef4444; --warning: #f59e0b; }
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);margin:0; overflow-x: hidden;}

.sidebar { width: 100%; background: #111418; padding: 10px; display: flex; overflow-x: auto; gap: 10px; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100; scrollbar-width: none;}
.sidebar::-webkit-scrollbar { display: none; }
.nav-btn { background: #1f2937; color: #9ca3af; padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: 800; white-space: nowrap; border: 1px solid transparent; cursor: pointer; transition: 0.3s; }
.nav-btn.active { background: var(--primary); color: white; border-color: #818cf8; }

.container{padding:15px; max-width: 800px; margin: auto;}
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card{background:var(--card);padding:20px;border-radius:20px;margin-top:15px; border: 1px solid #30363d;}
input,button,select,textarea{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:none; box-sizing: border-box; font-family: inherit;}
input, select, textarea{background:#0d1117;color:white;border:1px solid #30363d}
textarea{resize: vertical; min-height: 100px; line-height: 1.5;} 
button{background:var(--primary);color:white;font-weight:800; cursor: pointer; transition: 0.2s;}
button:active { transform: scale(0.96); }

.table-container { width: 100%; overflow-x: auto; border-radius: 12px; background: #0d1117; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px; }
th { background: #1f2937; color: var(--primary); padding: 12px; text-align: left; }
td { padding: 12px; border-bottom: 1px solid #1f2937; vertical-align: middle; }

.datos-detalle { display: block; background: #0a0c10; color: var(--accent); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 5px; border: 1px dashed #30363d; white-space: pre-wrap; text-align: left; }
.btn-small { width: auto; padding: 6px 10px; font-size: 10px; margin: 2px; }
.badge { padding: 3px 8px; border-radius: 6px; font-weight: bold; background: #334155; }

.logout{background:var(--danger); width: auto; padding: 8px 15px; font-size: 12px; margin-left: auto;}
.btn-clear { background: var(--danger); font-size: 12px; margin-top: 15px; width: auto; padding: 10px 20px; }

.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(20px); }
</style>
</head>

<body>

<div id="login" class="container">
    <div class="card" style="text-align: center; margin-top: 50px;">
        <h1>⚡ ANDY VIP</h1>
        <input id="log-email" placeholder="Usuario">
        <input id="log-pass" type="password" placeholder="Clave">
        <button onclick="handleLogin()">INGRESAR AL SISTEMA</button>
    </div>
</div>

<div id="app" style="display:none">
    
    <div class="sidebar">
        <button class="nav-btn active" onclick="showPage('p-solicitar', this)">🎁 Pedir Cuenta</button>
        <button class="nav-btn" onclick="showPage('p-quejas', this)">📩 Quejas</button>
        <button class="nav-btn admin-only" onclick="showPage('p-cuentas', this)">📺 Stock</button>
        <button class="nav-btn admin-only" onclick="showPage('p-pedidos', this)">📊 Historial</button>
        <button class="nav-btn admin-only" onclick="showPage('p-admin', this)">🔑 Accesos</button>
        <button class="logout" onclick="logout()">Salir</button>
    </div>

    <div class="container">
        
        <div id="p-solicitar" class="page active">
            <div class="card">
                <h3>Obtener nueva cuenta</h3>
                <p style="font-size: 11px; color: var(--warning);">Límite: 1 cuenta cada 12 horas.</p>
                <input id="c-cliente-nombre" placeholder="Nombre Completo">
                <input id="c-cliente-phone" placeholder="Número de Celular">
                <select id="select-plataforma"><option>Cargando plataformas...</option></select>
                <button onclick="pedirCuenta()">RECLAMAR CUENTA AHORA</button>
                <div id="resultado-entrega"></div>
            </div>
        </div>

        <div id="p-quejas" class="page">
            <div class="card">
                <h3>Buzón de Reportes</h3>
                <input id="q-nombre" placeholder="Tu Nombre">
                <textarea id="q-texto" placeholder="Describe el problema aquí..."></textarea>
                <button onclick="enviarQueja()" style="background:var(--warning)">Enviar Reporte</button>
            </div>
            <div class="admin-only">
                <div class="card">
                    <h3>Quejas Recibidas (Admin)</h3>
                    <div id="lista-quejas"></div>
                </div>
            </div>
        </div>

        <div id="p-cuentas" class="page">
            <div class="card">
                <h3>Agregar Plataforma</h3>
                <input id="c-app" placeholder="Nombre App">
                <textarea id="c-datos" placeholder="Datos de la cuenta"></textarea>
                <input id="c-cupo" type="number" placeholder="Stock">
                <button onclick="addCuenta()" style="background:var(--accent)">Subir al sistema</button>
            </div>
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead><tr><th>Información</th><th>Stock</th><th>Acciones</th></tr></thead>
                        <tbody id="lista-cuentas-admin"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="p-pedidos" class="page">
            <div class="card">
                <h3>Historial de Entregas</h3>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Miembro</th><th>App</th><th>Teléfono</th><th>Acciones</th></tr></thead>
                        <tbody id="historial-tabla-body"></tbody>
                    </table>
                </div>
                <button class="btn-clear" onclick="limpiarHistorial()">Vaciar Historial</button>
            </div>
        </div>

        <div id="p-admin" class="page">
            <div class="card">
                <h3>Crear Admin o Seller</h3>
                <input id="new-email" placeholder="Correo">
                <input id="new-pass" placeholder="Clave">
                <select id="new-role"><option value="seller">SELLER</option><option value="admin">ADMINISTRADOR</option></select>
                <button onclick="crearUsuario()">Crear Acceso</button>
            </div>
            <div class="card">
                <h3>Gestión de Usuarios</h3>
                <div id="lista-usuarios-admin"></div>
            </div>
        </div>

    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, getDocs, query, where, deleteDoc, doc, updateDoc, serverTimestamp, orderBy, writeBatch, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM", authDomain:"sistema-ventas-64a4c.firebaseapp.com", projectId:"sistema-ventas-64a4c" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const MASTER = "andyobregon799@gmail.com";

window.showPage = (id, btn) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
};

window.handleLogin = async () => {
    const e = document.getElementById("log-email").value;
    const p = document.getElementById("log-pass").value;
    try {
        if(e !== MASTER) {
            const uSnap = await getDoc(doc(db, "usuarios_permisos", e));
            if(uSnap.exists() && !uSnap.data().estado) return alert("Cuenta desactivada");
        }
        await signInWithEmailAndPassword(auth, e, p);
    } catch { alert("Error de acceso"); }
};

window.logout = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, async (user) => {
    if(user) {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
        if(user.email === MASTER) {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            loadAdminData();
        } else {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        }
        loadUserData();
    }
});

function loadUserData() {
    onSnapshot(collection(db, "cuentas"), snap => {
        let h = '<option value="">-- Selecciona Plataforma --</option>';
        snap.forEach(d => { if(d.data().cupo > 0) h += `<option value="${d.id}">${d.data().app}</option>`; });
        document.getElementById("select-plataforma").innerHTML = h;
    });
}

// PEDIR CUENTA ARREGLADO
window.pedirCuenta = async () => {
    const n = document.getElementById("c-cliente-nombre").value.trim().toLowerCase();
    const t = document.getElementById("c-cliente-phone").value.trim();
    const cId = document.getElementById("select-plataforma").value;

    if(!n || !t || !cId) return alert("Faltan datos");

    const doceHorasAtras = new Date(Date.now() - 12 * 60 * 60 * 1000);
    const qNombre = query(collection(db, "historial"), where("miembro_id", "==", n), where("fecha", ">", doceHorasAtras));
    const qTel = query(collection(db, "historial"), where("telefono", "==", t), where("fecha", ">", doceHorasAtras));

    const [snapN, snapT] = await Promise.all([getDocs(qNombre), getDocs(qTel)]);
    if(!snapN.empty || !snapT.empty) return alert("⛔ Espera 12 horas para pedir otra.");

    const docRef = doc(db, "cuentas", cId);
    const cSnap = await getDoc(docRef);

    if(cSnap.exists() && cSnap.data().cupo > 0) {
        const datosC = cSnap.data().datos;
        const appN = cSnap.data().app;
        const stockActual = cSnap.data().cupo;

        // Mostrar cuenta al cliente
        document.getElementById("resultado-entrega").innerHTML = `
        <div class="card" style="border:2px solid var(--accent); text-align:center;">
            <p style="color:var(--accent); font-weight:800;">✅ CUENTA ENTREGADA:</p>
            <div id="copy-text" style="background:#000; padding:15px; color:var(--accent); white-space: pre-wrap; font-size:12px; border-radius:10px; margin-bottom:10px; text-align:left; font-family:monospace;">${datosC}</div>
            <button onclick="copyAcc()">COPIAR DATOS 📋</button>
        </div>`;

        // Guardar en historial y restar stock
        await addDoc(collection(db, "historial"), { miembro: n, miembro_id: n, telefono: t, app: appN, fecha: serverTimestamp() });
        await updateDoc(docRef, { cupo: stockActual - 1 });
    }
};

window.copyAcc = () => {
    const text = document.getElementById('copy-text').innerText;
    navigator.clipboard.writeText(text);
    alert("¡Copiado!");
};

window.enviarQueja = async () => {
    const n = document.getElementById("q-nombre").value;
    const m = document.getElementById("q-texto").value;
    if(n && m) {
        await addDoc(collection(db, "quejas"), { nombre: n, mensaje: m, fecha: serverTimestamp() });
        alert("Reporte enviado.");
        document.getElementById("q-nombre").value = ""; document.getElementById("q-texto").value = "";
    }
};

window.mandarAdvertencia = (num) => {
    const msg = prompt("Escribe el aviso para el WhatsApp:");
    if(msg) window.open(`https://wa.me/${num}?text=${encodeURIComponent("⚠️ AVISO VIP: " + msg)}`, '_blank');
};

function loadAdminData() {
    onSnapshot(collection(db, "cuentas"), snap => {
        let h = "";
        snap.forEach(d => {
            const c = d.data();
            h += `<tr><td><b>${c.app}</b><span class="datos-detalle">${c.datos}</span></td>
            <td><span class="badge">${c.cupo}</span></td>
            <td><button class="btn-small" style="background:var(--warning)" onclick="resetCupo('${d.id}')">Stock</button>
            <button class="btn-small" style="background:var(--danger)" onclick="eliminarDoc('cuentas','${d.id}')">X</button></td></tr>`;
        });
        document.getElementById("lista-cuentas-admin").innerHTML = h;
    });

    onSnapshot(query(collection(db, "historial"), orderBy("fecha", "desc")), snap => {
        let h = "";
        snap.forEach(d => {
            const data = d.data();
            h += `<tr><td>${data.miembro}</td><td>${data.app}</td><td>${data.telefono}</td>
            <td><button class="btn-small" style="background:var(--danger)" onclick="mandarAdvertencia('${data.telefono}')">⚠️ Avisar</button></td></tr>`;
        });
        document.getElementById("historial-tabla-body").innerHTML = h;
    });

    onSnapshot(query(collection(db, "quejas"), orderBy("fecha", "desc")), snap => {
        let h = "";
        snap.forEach(d => {
            h += `<div class="card" style="font-size:12px; border-left:4px solid var(--warning);">
            <b>De: ${d.data().nombre}</b><p>${d.data().mensaje}</p>
            <button class="btn-small" onclick="eliminarDoc('quejas','${d.id}')">Borrar</button></div>`;
        });
        document.getElementById("lista-quejas").innerHTML = h;
    });

    onSnapshot(collection(db, "usuarios_permisos"), snap => {
        let h = "";
        snap.forEach(d => {
            if(d.id === MASTER) return;
            h += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333; align-items:center;">
                <span>${d.id}</span>
                <label class="switch"><input type="checkbox" ${d.data().estado ? 'checked' : ''} onchange="toggleUser('${d.id}', this.checked)"><span class="slider"></span></label>
            </div>`;
        });
        document.getElementById("lista-usuarios-admin").innerHTML = h;
    });
}

window.toggleUser = async (e, s) => { await updateDoc(doc(db, "usuarios_permisos", e), { estado: s }); };
window.addCuenta = async () => {
    const a = document.getElementById("c-app").value; const d = document.getElementById("c-datos").value; const c = parseInt(document.getElementById("c-cupo").value);
    if(a && d) { await addDoc(collection(db, "cuentas"), { app: a, datos: d, cupo: c }); alert("Agregado al Stock"); }
};
window.crearUsuario = async () => {
    const e = document.getElementById("new-email").value; const p = document.getElementById("new-pass").value; const r = document.getElementById("new-role").value;
    try { await createUserWithEmailAndPassword(auth, e, p); await setDoc(doc(db, "usuarios_permisos", e), { rol: r, estado: true }); alert("Acceso Creado"); } catch { alert("Error al crear usuario"); }
};
window.resetCupo = async (id) => { const n = prompt("Nuevo Stock:"); if(n) await updateDoc(doc(db, "cuentas", id), { cupo: parseInt(n) }); };
window.eliminarDoc = async (p, id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, p, id)); };
window.limpiarHistorial = async () => {
    if(confirm("¿Vaciar Historial?")){
        const q = await getDocs(collection(db, "historial"));
        const b = writeBatch(db); q.forEach(d => b.delete(d.ref)); await b.commit();
    }
};
</script>
</body>
</html>
