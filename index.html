<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFA ANDY PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0c10;color:#fff;margin:0}
.container{padding:15px;max-width:500px;margin:auto}
.card{background:#161b22;padding:20px;border-radius:20px;margin-top:15px}
input,button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none}
input{background:#0d1117;color:white;border:1px solid #30363d}
button{background:#6366f1;color:white;font-weight:bold}
.ticket{
background:linear-gradient(135deg,#6366f1,#22c55e);
padding:20px;border-radius:20px;text-align:center;margin-top:15px}
.admin-only{display:none}
</style>
</head>

<body>

<div id="login" class="container">
<div class="card">
<h2>🎟️ RIFA ANDY</h2>
<input id="log-email" placeholder="Correo">
<input id="log-pass" placeholder="Clave">
<button onclick="handleLogin()">Entrar</button>
</div>
</div>

<div id="app" style="display:none" class="container">

<div class="card">
<h3>Registrar participante</h3>

<input id="part-name" placeholder="Nombre">
<input id="part-phone" placeholder="Teléfono">
<input type="file" id="part-captura" accept="image/*">

<img id="preview" style="width:100%;margin-top:10px;display:none;border-radius:10px">

<label>
<input type="checkbox" id="terms"> Acepto términos y condiciones
</label>

<button onclick="registrarBoleto()">Generar boleto</button>

<div id="ticket"></div>

</div>

<div class="card admin-only" id="admin">
<h3>📊 Historial</h3>
<div id="historial"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore,collection,addDoc,onSnapshot,getDocs,query,where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
authDomain:"sistema-ventas-64a4c.firebaseapp.com",
projectId:"sistema-ventas-64a4c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const MASTER="andyobregon799@gmail.com";
let userEmail="";

window.handleLogin=async()=>{
await signInWithEmailAndPassword(auth,log-email.value,log-pass.value);
};

onAuthStateChanged(auth,u=>{
if(u){
userEmail=u.email;
login.style.display="none";
app.style.display="block";

if(userEmail===MASTER){
document.getElementById("admin").style.display="block";
loadAdmin();
}
}
});

// PREVIEW IMAGEN
part-captura.onchange=()=>{
let file=part-captura.files[0];
if(file){
preview.src=URL.createObjectURL(file);
preview.style.display="block";
}
};

// REGISTRO PRO
window.registrarBoleto=async()=>{

if(!terms.checked) return alert("Acepta términos");

let nombre=part-name.value.trim();
let telefono=part-phone.value.trim();
let file=part-captura.files[0];

if(!nombre||!telefono) return alert("Completa datos");
if(!file) return alert("Sube captura");
if(file.size<5000) return alert("Imagen inválida");

// 🔥 ANTI DUPLICADO
const q=query(collection(db,"boletos"),where("telefono","==",telefono));
const snap=await getDocs(q);

if(!snap.empty){
return alert("❌ Este número ya está registrado");
}

// 🔥 GENERAR CÓDIGO
let codigo="ANDY-"+Math.floor(100000+Math.random()*900000);

await addDoc(collection(db,"boletos"),{
nombre,
telefono,
boleto:codigo,
user:userEmail,
fecha:new Date()
});

// 🎟️ BOLETO PRO
ticket.innerHTML=`
<div class="ticket">
<h2>🎟️ BOLETO OFICIAL</h2>
<h1>${codigo}</h1>
<p>${nombre}</p>
<p>${telefono}</p>
<small>Guárdalo bien</small>
</div>
`;

};

// ADMIN
function loadAdmin(){
onSnapshot(collection(db,"boletos"),snap=>{
let html="";
snap.forEach(d=>{
let b=d.data();
html+=`<p>#${b.boleto} - ${b.nombre} (${b.telefono})</p>`;
});
historial.innerHTML=html;
});
}

</script>

</body>
</html>
