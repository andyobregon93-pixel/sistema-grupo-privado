<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFA ANDY PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0c10;color:#fff;margin:0}
.container{padding:15px;max-width:500px;margin:auto}
.card{background:#161b22;padding:20px;border-radius:20px;margin-top:15px}
input,button,select{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none}
input{background:#0d1117;color:white;border:1px solid #30363d}
button{background:#6366f1;color:white;font-weight:bold}
button:disabled{opacity:0.6}
.ticket{background:linear-gradient(135deg,#6366f1,#22c55e);padding:20px;border-radius:20px;text-align:center;margin-top:15px}
.admin-only{display:none}
.card-item{background:#0d1117;padding:15px;border-radius:15px;margin-bottom:15px;border:1px solid #30363d}
.card-item img{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>

<body>

<div id="login" class="container">
<div class="card">
<h2>🎟️ RIFA ANDY</h2>
<input id="log-email" placeholder="Correo">
<input id="log-pass" placeholder="Clave">
<button onclick="handleLogin()">Entrar</button>
</div>
</div>

<div id="app" style="display:none" class="container">

<div class="card">
<h3>Registrar participante</h3>

<input id="part-name" placeholder="Nombre">
<input id="part-phone" placeholder="Teléfono">
<input id="part-monto" placeholder="Monto pagado">
<input type="file" id="part-captura" accept="image/*">

<img id="preview" style="width:100%;margin-top:10px;display:none;border-radius:10px">

<label>
<input type="checkbox" id="terms"> Acepto términos y condiciones
</label>

<button onclick="registrarBoleto()">Generar boleto</button>

<div id="ticket"></div>

<div id="btn-wsp" style="display:none;">
<button onclick="enviarWhatsApp()">Enviar por WhatsApp 📲</button>
</div>

</div>

<div class="card admin-only" id="admin">

<h3>👤 Crear Usuario</h3>

<input id="new-email" placeholder="Correo">
<input id="new-pass" placeholder="Clave">

<select id="new-role">
<option value="user">Usuario</option>
<option value="admin">Administrador</option>
</select>

<button onclick="crearUsuario()">Crear usuario</button>

<hr>

<h3>📊 HISTORIAL COMPLETO</h3>
<div id="historial"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword,onAuthStateChanged,createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore,collection,addDoc,onSnapshot,getDocs,query,where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
authDomain:"sistema-ventas-64a4c.firebaseapp.com",
projectId:"sistema-ventas-64a4c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const MASTER="andyobregon799@gmail.com";
let userEmail="";
let ultimoBoleto={};

// LOGIN
window.handleLogin = async () => {
const btn = document.querySelector("button[onclick='handleLogin()']");
const email = document.getElementById("log-email").value;
const pass = document.getElementById("log-pass").value;

if(!email || !pass) return alert("Completa los campos");

btn.innerText="Entrando...";
btn.disabled=true;

try{
await signInWithEmailAndPassword(auth,email,pass);
}catch(e){
alert("❌ "+e.message);
}

btn.innerText="Entrar";
btn.disabled=false;
};

// ADMIN
onAuthStateChanged(auth,(u)=>{
if(u){
userEmail=u.email;
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

if(userEmail===MASTER){
document.getElementById("admin").style.display="block";
loadAdmin();
}
}
});

// PREVIEW
document.getElementById("part-captura").onchange=()=>{
let file=document.getElementById("part-captura").files[0];
if(file){
document.getElementById("preview").src=URL.createObjectURL(file);
document.getElementById("preview").style.display="block";
}
};

// REGISTRO
window.registrarBoleto=async()=>{

if(!document.getElementById("terms").checked) return alert("Acepta términos");

let nombre=document.getElementById("part-name").value.trim();
let telefono=document.getElementById("part-phone").value.trim();
let monto=document.getElementById("part-monto").value.trim();
let file=document.getElementById("part-captura").files[0];

if(!nombre||!telefono||!monto) return alert("Completa datos");
if(!file) return alert("Sube captura");
if(file.size<5000) return alert("Imagen inválida");

let reader=new FileReader();

reader.onload=async function(){

const q=query(collection(db,"boletos"),where("telefono","==",telefono));
const snap=await getDocs(q);

if(!snap.empty){
return alert("❌ Ya registrado");
}

let codigo="ANDY-"+Math.floor(100000+Math.random()*900000);

await addDoc(collection(db,"boletos"),{
nombre,
telefono,
monto,
captura:reader.result,
boleto:codigo,
user:userEmail,
fecha:new Date()
});

ultimoBoleto={nombre,telefono,monto,codigo};

document.getElementById("ticket").innerHTML=`
<div class="ticket">
<h2>🎟️ BOLETO</h2>
<h1>${codigo}</h1>
<p>${nombre}</p>
<p>${telefono}</p>
<p>$${monto}</p>
</div>
`;

document.getElementById("btn-wsp").style.display="block";

};

reader.readAsDataURL(file);
};

// WHATSAPP
window.enviarWhatsApp=()=>{
let msg=`🎟️ BOLETO RIFA ANDY\n\nCódigo: ${ultimoBoleto.codigo}\nNombre: ${ultimoBoleto.nombre}\nTeléfono: ${ultimoBoleto.telefono}\nMonto: $${ultimoBoleto.monto}`;
let url=`https://wa.me/?text=${encodeURIComponent(msg)}`;
window.open(url,"_blank");
};

// CREAR USUARIO
window.crearUsuario=async()=>{
const email=document.getElementById("new-email").value;
const pass=document.getElementById("new-pass").value;

if(!email||!pass) return alert("Completa datos");

try{
await createUserWithEmailAndPassword(auth,email,pass);
alert("✅ Usuario creado");
}catch(e){
alert("❌ "+e.message);
}
};

// HISTORIAL
function loadAdmin(){
onSnapshot(collection(db,"boletos"),snap=>{
let html="";
snap.forEach(d=>{
let b=d.data();
html+=`
<div class="card-item">
<h3>🎟️ ${b.boleto}</h3>
<p>👤 ${b.nombre}</p>
<p>📱 ${b.telefono}</p>
<p>💰 $${b.monto}</p>
${b.captura ? `<img src="${b.captura}">` : ""}
</div>`;
});
document.getElementById("historial").innerHTML=html;
});
}

</script>

</body>
</html>
