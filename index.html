<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDVIP | Sistema Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; 
            --danger: #ef4444; --success: #10b981; --text: #f8fafc; 
            --border: #334155; --gold: #fbbf24;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 30px; }
        
        .nav-bar { display: flex; background: var(--card); padding: 10px; position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--accent); gap: 5px; overflow-x: auto; }
        .nav-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #94a3b8; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 0.75rem; white-space: nowrap; }
        .nav-btn.active { color: white; background: var(--accent); }
        .btn-logout { background: var(--danger); color: white; padding: 10px 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .container { padding: 15px; max-width: 1000px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }
        
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--border); background: #0f172a; color: white; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-save { background: var(--success); color: white; }
        
        /* ESTILO TICKET IMPRESO */
        #factura-pos { 
            width: 300px; background: white; color: black; padding: 20px; 
            margin: 10px auto; font-family: 'Courier New', monospace; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5); display: none;
        }
        .t-center { text-align: center; }
        .t-bold { font-weight: bold; }
        .linea { border-top: 1px dashed black; margin: 10px 0; }
        .item-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 5px 0; }
    </style>
</head>
<body>

<div id="login-box" style="display: flex; height: 100vh; align-items: center; justify-content: center;">
    <div class="card" style="width:320px; text-align:center;">
        <h1 style="color:var(--accent);">ANDVIP</h1>
        <input type="email" id="email" placeholder="Usuario">
        <input type="password" id="password" placeholder="Clave">
        <button onclick="login()" class="btn-main btn-save">INGRESAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showTab('tab-membresias', this)">💳 CLIENTES</button>
        <button class="nav-btn" onclick="showTab('tab-stock', this)">📦 STOCK</button>
        <button class="nav-btn" onclick="showTab('tab-factura', this)">📄 FACTURA</button>
        <button class="nav-btn" onclick="showTab('tab-historial', this)">🕒 HISTORIAL</button>
        <button class="btn-logout" onclick="logout()">SALIR</button>
    </div>

    <div class="container">
        <div id="tab-membresias" class="section active">
            <div class="card">
                <h3 id="form-title">Nuevo Registro VIP</h3>
                <input type="hidden" id="edit-id">
                <input type="text" id="m-nombre" placeholder="Nombre">
                <input type="text" id="m-movil" placeholder="WhatsApp">
                <input type="text" id="m-plan" placeholder="Servicio">
                <div style="display:flex; gap:5px;">
                    <input type="date" id="m-inicio">
                    <input type="date" id="m-fin">
                </div>
                <button onclick="guardarCliente()" class="btn-main btn-save">GUARDAR</button>
            </div>
            <div class="card">
                <table style="width:100%; border-collapse: collapse;">
                    <tbody id="lista-clientes"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-factura" class="section">
            <div class="card">
                <h3>Emitir Recibo Oficial</h3>
                <input type="text" id="f-nom" readonly style="opacity:0.6;">
                <input type="number" id="f-precio" placeholder="Monto $">
                <button onclick="generarTicket()" class="btn-main" style="background:var(--accent); color:white;">VISTA PREVIA</button>
            </div>

            <div id="factura-pos">
                <div class="t-center t-bold" style="font-size: 1.2rem;">ANDVIP</div>
                <div class="t-center">RECIBO DE PAGO</div>
                <div class="linea"></div>
                <div class="item-row"><span>FECHA:</span><span id="p-fecha"></span></div>
                <div class="item-row"><span>TICKET:</span><span id="p-num"></span></div>
                <div class="linea"></div>
                <div class="item-row"><span>CLIENTE:</span><span id="p-nom" class="t-bold"></span></div>
                <div class="item-row"><span>PLAN:</span><span id="p-plan"></span></div>
                <div class="item-row"><span>VENCE:</span><span id="p-vence"></span></div>
                <div class="linea"></div>
                <div class="item-row" style="font-size: 1.1rem;"><span>TOTAL:</span><span class="t-bold">$<span id="p-total"></span></span></div>
                <div class="linea"></div>
                <div class="t-center" style="font-size: 0.7rem;">ESTADO: PAGADO ✅</div>
                <div class="t-center" style="font-size: 0.7rem;">No se aceptan devoluciones</div>
            </div>
            
            <button id="btn-wa" onclick="enviarWhatsAppPDF()" class="btn-main" style="display:none; background:#25d366; color:white; margin-top:10px;">GENERAR Y ENVIAR</button>
        </div>

        <div id="tab-stock" class="section">
            <div class="card"><h3>📦 Stock</h3><p>Gestión de productos aquí.</p></div>
        </div>

        <div id="tab-historial" class="section">
            <div class="card"><h3>🕒 Historial</h3><div id="historial-list"></div></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // LOGIN
    window.login = async () => {
        try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
        catch(e) { alert("Error"); }
    };
    window.logout = () => signOut(auth);
    onAuthStateChanged(auth, u => {
        document.getElementById('login-box').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
    });

    // CLIENTES
    window.guardarCliente = async () => {
        const id = document.getElementById('edit-id').value;
        const d = {
            nombre: document.getElementById('m-nombre').value,
            movil: document.getElementById('m-movil').value,
            plan: document.getElementById('m-plan').value,
            inicio: document.getElementById('m-inicio').value,
            fin: document.getElementById('m-fin').value,
            timestamp: serverTimestamp()
        };
        id ? await updateDoc(doc(db, "membresias_vip", id), d) : await addDoc(collection(db, "membresias_vip"), d);
        document.querySelectorAll('input').forEach(i => i.value = "");
    };

    onSnapshot(query(collection(db, "membresias_vip"), orderBy("timestamp", "desc")), s => {
        const l = document.getElementById('lista-clientes'); l.innerHTML = "";
        s.forEach(d => {
            const m = d.data();
            l.innerHTML += `<tr style="border-bottom:1px solid #334155;">
                <td style="padding:10px;"><b>${m.nombre}</b><br><small>${m.plan}</small></td>
                <td><button onclick="prepFac('${m.nombre}','${m.movil}','${m.plan}','${m.fin}')">📜</button></td>
                <td><button onclick="eliminar('${d.id}')">🗑️</button></td>
            </tr>`;
        });
    });

    // FACTURA "PAPEL"
    var telActual = "";
    window.prepFac = (n, t, p, v) => {
        document.getElementById('f-nom').value = n;
        telActual = t;
        document.getElementById('p-nom').innerText = n;
        document.getElementById('p-plan').innerText = p;
        document.getElementById('p-vence').innerText = v;
        showTab('tab-factura', document.querySelector('[onclick*="tab-factura"]'));
    };

    window.generarTicket = () => {
        const p = document.getElementById('f-precio').value;
        if(!p) return alert("Pon el precio");
        document.getElementById('p-total').innerText = p;
        document.getElementById('p-fecha').innerText = new Date().toLocaleDateString();
        document.getElementById('p-num').innerText = Math.floor(Math.random()*9999);
        document.getElementById('factura-pos').style.display = 'block';
        document.getElementById('btn-wa').style.display = 'block';
    };

    window.enviarWhatsAppPDF = async () => {
        const element = document.getElementById('factura-pos');
        const canvas = await html2canvas(element);
        const imgData = canvas.toDataURL('image/png');
        
        // Crear PDF estilo Recibo
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: [80, 150] }); // Tamaño ticket
        pdf.addImage(imgData, 'PNG', 0, 0, 80, 0);
        
        const nom = document.getElementById('p-nom').innerText;
        pdf.save(`Ticket_${nom}.pdf`);

        const msg = `*📄 RECIBO OFICIAL ANDVIP*%0AEstimado ${nom}, adjunto su ticket de pago oficial.`;
        window.open(`https://wa.me/${telActual}?text=${msg}`, '_blank');
        
        await addDoc(collection(db, "historial_vip"), { msg: `Ticket a ${nom}`, timestamp: serverTimestamp() });
    };

    window.showTab = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
    };

    window.eliminar = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "membresias_vip", id)); };
</script>
</body>
</html>
