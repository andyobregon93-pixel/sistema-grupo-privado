<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDY VIP | Admin Master Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #070b14; --card: #111827; --accent: #3b82f6; 
            --danger: #ef4444; --success: #10b981; --text: #f1f5f9; 
            --border: #1f2937; --gold: #f59e0b; --purple: #a855f7;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        .nav-bar { 
            display: flex; background: var(--card); padding: 10px; 
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent);
            justify-content: space-around; flex-wrap: wrap; gap: 5px;
        }
        .nav-btn { 
            padding: 8px 12px; border: none; background: transparent; 
            color: #94a3b8; font-weight: 600; cursor: pointer; transition: 0.3s;
            border-radius: 8px; font-size: 0.75rem;
        }
        .nav-btn.active { color: white; background: var(--accent); }

        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid var(--border); background: #0f172a; color: white; box-sizing: border-box; 
        }
        
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .btn-save { background: var(--success); color: white; }
        .btn-edit { background: var(--gold); color: black; padding: 5px 8px; border-radius: 5px; border:none; font-size: 0.7rem; cursor:pointer;}
        .btn-delete { background: var(--danger); color: white; padding: 5px 8px; border-radius: 5px; border:none; cursor:pointer;}
        
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 1px solid var(--border); background: #1e293b;
            margin-bottom: 5px; border-radius: 8px;
        }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .bg-money { background: #064e3b; color: #34d399; }

        #factura-render { 
            width: 350px; background: white; color: #000; padding: 30px; 
            position: absolute; left: -9999px; font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

<div id="login-box" style="display: flex; height: 100vh; align-items: center; justify-content: center;">
    <div class="card" style="width:320px; text-align:center; border: 2px solid var(--accent);">
        <h1 style="color:var(--accent); margin:0;">ANDY VIP</h1>
        <p style="font-size:0.8rem; color:#64748b;">MASTER ADMIN PANEL</p>
        <input type="email" id="email" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()" class="btn-main btn-save">INGRESAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showTab('tab-staff', this)">👷 STAFF</button>
        <button class="nav-btn" onclick="showTab('tab-clientes', this)">👥 CLIENTES</button>
        <button class="nav-btn" onclick="showTab('tab-deudores', this)">💸 DEUDORES</button>
        <button class="nav-btn" onclick="showTab('tab-logs', this)">📜 LOGS</button>
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">SALIR</button>
    </div>

    <div class="container">
        
        <div id="tab-staff" class="section active">
            <div class="card">
                <h3 id="staff-form-title">👷 Registrar Personal</h3>
                <input type="hidden" id="s-id">
                <input type="text" id="s-nombre" placeholder="Nombre completo">
                <input type="text" id="s-movil" placeholder="WhatsApp (Ej: 521...)">
                <textarea id="s-pago" placeholder="Métodos de pago (Ej: Nequi 123..., Banco X, PayPal...)"></textarea>
                <div class="grid-inputs">
                    <div><small>Próximo Pago</small><input type="date" id="s-fecha"></div>
                    <div><small>Sueldo/Corte</small><input type="number" id="s-monto" placeholder="$0.00"></div>
                </div>
                <button onclick="guardarStaff()" id="btn-staff-save" class="btn-main btn-save">GUARDAR TRABAJADOR</button>
                <button onclick="resetStaff()" id="btn-staff-cancel" style="display:none;" class="btn-main">CANCELAR</button>
            </div>
            <div id="lista-staff"></div>
        </div>

        <div id="tab-clientes" class="section">
            <div class="card">
                <h3>👥 Gestión de Clientes</h3>
                <input type="hidden" id="c-id">
                <input type="text" id="c-nombre" placeholder="Nombre del Cliente">
                <input type="text" id="c-movil" placeholder="WhatsApp">
                <div class="grid-inputs">
                    <div><small>Fecha Renovación</small><input type="date" id="c-fecha"></div>
                    <input type="text" id="c-plan" placeholder="Plan (Ej: VIP 1 Mes)">
                </div>
                <button onclick="guardarCliente()" class="btn-main btn-save">REGISTRAR CLIENTE</button>
            </div>
            <div id="lista-clientes-full"></div>
        </div>

        <div id="tab-deudores" class="section">
            <div class="card">
                <h3>💸 Control de Deudores</h3>
                <input type="text" id="d-nombre" placeholder="Nombre">
                <input type="text" id="d-movil" placeholder="WhatsApp">
                <div class="grid-inputs">
                    <input type="number" id="d-monto" placeholder="Monto $">
                    <input type="text" id="d-concepto" placeholder="Concepto de deuda">
                </div>
                <button onclick="guardarDeudores()" class="btn-main btn-save" style="background:var(--purple)">REGISTRAR DEUDA</button>
            </div>
            <div id="lista-deudores"></div>
        </div>

        <div id="tab-logs" class="section">
            <div class="card">
                <h3>📜 Historial Global</h3>
                <div id="historial-list"></div>
            </div>
        </div>

    </div>
</div>

<div id="factura-render">
    <div style="text-align: center; border-bottom: 2px solid #000;">
        <h2 style="margin:0;">ANDY VIP</h2>
        <p>Comprobante Digital</p>
    </div>
    <div style="margin-top:20px;">
        <p><b>FECHA:</b> <span id="p-fecha"></span></p>
        <p><b>FOLIO:</b> <span id="p-folio"></span></p>
        <p><b>CLIENTE:</b> <span id="p-nom"></span></p>
        <p><b>CONCEPTO:</b> <span id="p-concepto"></span></p>
        <hr>
        <h3 style="text-align:right;">TOTAL: $<span id="p-total"></span></h3>
        <p style="font-size: 0.7rem; text-align: center; margin-top: 30px;">ID Transacción: <br>ANDYVIP-TRX-882</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyArnqs6NzzauyMJlx6w3vfUaQqZaithGpM",
        authDomain: "sistema-ventas-64a4c.firebaseapp.com",
        projectId: "sistema-ventas-64a4c",
        storageBucket: "sistema-ventas-64a4c.firebasestorage.app",
        messagingSenderId: "291577824119",
        appId: "1:291577824119:web:894fe9842b427c9ac3d772"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // AUTH
    window.login = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert("Credenciales incorrectas"); }
    };
    window.logout = () => signOut(auth);
    onAuthStateChanged(auth, u => {
        document.getElementById('login-box').style.display = u ? 'none' : 'flex';
        document.getElementById('app').style.display = u ? 'block' : 'none';
    });

    // --- LOGICA STAFF (CON EDICIÓN) ---
    window.guardarStaff = async () => {
        const id = document.getElementById('s-id').value;
        const data = {
            nombre: document.getElementById('s-nombre').value,
            movil: document.getElementById('s-movil').value,
            metodosPago: document.getElementById('s-pago').value,
            fechaPago: document.getElementById('s-fecha').value,
            monto: document.getElementById('s-monto').value,
            timestamp: serverTimestamp()
        };
        if(!data.nombre) return alert("Falta nombre");

        if(id) {
            await updateDoc(doc(db, "staff", id), data);
            alert("Trabajador actualizado");
        } else {
            await addDoc(collection(db, "staff"), data);
            alert("Trabajador registrado");
        }
        resetStaff();
    };

    window.resetStaff = () => {
        document.getElementById('s-id').value = "";
        document.getElementById('s-nombre').value = "";
        document.getElementById('s-movil').value = "";
        document.getElementById('s-pago').value = "";
        document.getElementById('s-fecha').value = "";
        document.getElementById('s-monto').value = "";
        document.getElementById('staff-form-title').innerText = "👷 Registrar Personal";
        document.getElementById('btn-staff-cancel').style.display = "none";
    };

    window.editarStaff = (id, nom, mov, met, fec, mon) => {
        document.getElementById('s-id').value = id;
        document.getElementById('s-nombre').value = nom;
        document.getElementById('s-movil').value = mov;
        document.getElementById('s-pago').value = met;
        document.getElementById('s-fecha').value = fec;
        document.getElementById('s-monto').value = mon;
        document.getElementById('staff-form-title').innerText = "✏️ Editando: " + nom;
        document.getElementById('btn-staff-cancel').style.display = "block";
        window.scrollTo(0,0);
    };

    onSnapshot(query(collection(db, "staff"), orderBy("timestamp", "desc")), s => {
        const list = document.getElementById('lista-staff');
        list.innerHTML = "";
        s.forEach(d => {
            const st = d.data();
            list.innerHTML += `
                <div class="list-item">
                    <div>
                        <b>${st.nombre}</b> <span class="badge bg-money">$${st.monto}</span><br>
                        <small>📅 Pago: ${st.fechaPago}</small><br>
                        <small style="color:var(--gold)">💰 ${st.metodosPago.substring(0,30)}...</small>
                    </div>
                    <div>
                        <button onclick="editarStaff('${d.id}','${st.nombre}','${st.movil}','${st.metodosPago}','${st.fechaPago}','${st.monto}')" class="btn-edit">✏️</button>
                        <button onclick="pagarTrabajador('${st.movil}', '${st.monto}', '${st.nombre}')" class="btn-edit" style="background:var(--success); color:white;">💸</button>
                        <button onclick="eliminarStaff('${d.id}')" class="btn-delete">🗑️</button>
                    </div>
                </div>`;
        });
    });

    window.pagarTrabajador = (tel, monto, nom) => {
        const msg = `*CONFIRMACIÓN DE PAGO - ANDY VIP*%0AHola *${nom}*, se ha emitido tu pago por *$${monto}*. ✅`;
        window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
        addDoc(collection(db, "historial_vip"), { detalle: `PAGO STAFF: ${nom} recibió $${monto}`, timestamp: serverTimestamp() });
    };

    window.eliminarStaff = async (id) => { if(confirm("¿Eliminar trabajador?")) await deleteDoc(doc(db, "staff", id)); };

    // --- LOGICA CLIENTES ---
    window.guardarCliente = async () => {
        const data = {
            nombre: document.getElementById('c-nombre').value,
            movil: document.getElementById('c-movil').value,
            fechaRenovacion: document.getElementById('c-fecha').value,
            plan: document.getElementById('c-plan').value,
            timestamp: serverTimestamp()
        };
        await addDoc(collection(db, "clientes_vip"), data);
        alert("Cliente guardado");
    };

    onSnapshot(query(collection(db, "clientes_vip"), orderBy("timestamp", "desc")), s => {
        const list = document.getElementById('lista-clientes-full');
        list.innerHTML = "";
        s.forEach(d => {
            const cl = d.data();
            list.innerHTML += `
                <div class="list-item">
                    <div><b>${cl.nombre}</b><br><small>Plan: ${cl.plan}</small><br><small>Renueva: ${cl.fechaRenovacion}</small></div>
                    <button onclick="cobrarCliente('${cl.movil}', '${cl.nombre}', '${cl.plan}')" class="btn-edit" style="background:var(--accent); color:white;">📲 Cobrar</button>
                </div>`;
        });
    });

    window.cobrarCliente = (tel, nom, plan) => {
        const msg = `*RECORDATORIO DE PAGO - ANDY VIP*%0AHola *${nom}*, te recordamos que tu plan *${plan}* está próximo a vencer. ¿Deseas renovar? 💎`;
        window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
    };

    // --- LOGICA DEUDORES ---
    window.guardarDeudores = async () => {
        const d = {
            nombre: document.getElementById('d-nombre').value,
            movil: document.getElementById('d-movil').value,
            monto: document.getElementById('d-monto').value,
            concepto: document.getElementById('d-concepto').value,
            status: "pendiente",
            timestamp: serverTimestamp()
        };
        await addDoc(collection(db, "deudores"), d);
    };

    onSnapshot(query(collection(db, "deudores"), orderBy("timestamp", "desc")), s => {
        const list = document.getElementById('lista-deudores');
        list.innerHTML = "";
        s.forEach(docSnap => {
            const de = docSnap.data();
            if(de.status === "pendiente") {
                list.innerHTML += `
                <div class="list-item" style="border-left: 4px solid var(--danger);">
                    <div><b>${de.nombre}</b> - <span style="color:var(--danger);">$${de.monto}</span><br><small>${de.concepto}</small></div>
                    <button onclick="liquidarDeuda('${docSnap.id}', '${de.nombre}', '${de.movil}', '${de.monto}', '${de.concepto}')" style="background:var(--success); color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">BAJA ✅</button>
                </div>`;
            }
        });
    });

    window.liquidarDeuda = async (id, nom, tel, monto, conc) => {
        if(!confirm("¿Confirmar pago y generar factura?")) return;
        await updateDoc(doc(db, "deudores", id), { status: "pagado" });
        
        document.getElementById('p-nom').innerText = nom;
        document.getElementById('p-total').innerText = monto;
        document.getElementById('p-concepto').innerText = conc;
        document.getElementById('p-fecha').innerText = new Date().toLocaleDateString();
        document.getElementById('p-folio').innerText = Math.floor(Math.random()*9000);

        const canvas = await html2canvas(document.getElementById('factura-render'), { scale: 2 });
        const img = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: [80, 150] });
        pdf.addImage(img, 'PNG', 0, 0, 80, 0);
        pdf.save(`Recibo_${nom}.pdf`);

        const msg = `*PAGO CONFIRMADO - ANDY VIP*%0AHola *${nom}*, gracias por tu pago de *$${monto}* por *${conc}*. ✅ (PDF adjunto enviado)`;
        window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
        
        await addDoc(collection(db, "historial_vip"), { detalle: `LIQUIDADO: ${nom} pagó deuda de $${monto}`, timestamp: serverTimestamp() });
    };

    // --- NAVEGACIÓN ---
    window.showTab = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
    };

    onSnapshot(query(collection(db, "historial_vip"), orderBy("timestamp", "desc")), s => {
        const hList = document.getElementById('historial-list');
        hList.innerHTML = "";
        s.forEach(d => {
            const h = d.data();
            hList.innerHTML += `<div style="font-size:0.75rem; padding:10px; border-bottom:1px solid #1f2937;">
                <b style="color:var(--accent)">[${h.timestamp?.toDate().toLocaleString() || '...'}]</b> ${h.detalle}
            </div>`;
        });
    });
</script>

</body>
</html>
